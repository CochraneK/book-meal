/* MING_THEME_SYNC_START */
/* ===== 《明朝那些事儿》母题皮肤 · 真源 =====
   人工只维护本文件，由 src/sync_ming_theme.py 镜像进 web/template/index.html。
   明书 base（app.css）本来就是暖棕朱红的纸墨底子，所以这里不另换配色，
   只补「宣纸 / 朱砂印章 / 年号刻度」三层母题 + 少量局部重构。

   母题粒度刻意做粗：1~2px 的细纹在 1280px 截图缩放后会完全消失
   （此前三本书换肤踩过），因此用 180px 平铺瓦片 + 2.5px 纤维点。 */
:root{
  --ming-seal:#8d3025;
  --ming-seal-soft:rgba(141,48,37,.10);
  --ming-fiber:rgba(120,96,64,.055);
  --ming-gold:#b88b35;
}

/* 宣纸：纤维斑点 + 横向帘纹，平铺瓦片保证缩放后仍可见 */
body{
  background-color:#f2eee6;
  background-image:
    radial-gradient(2.5px 2.5px at 24px 32px, var(--ming-fiber), transparent 62%),
    radial-gradient(2px 2px at 118px 96px, rgba(141,48,37,.045), transparent 62%),
    radial-gradient(2px 2px at 66px 148px, var(--ming-fiber), transparent 62%),
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(120,100,70,.028) 27px 28px);
  background-size:180px 180px,180px 180px,180px 180px,100% 28px;
  background-attachment:scroll;
}

/* 顶部一条朱砂压边：像线装书的天头 */
.app-header{border-top:3px solid var(--ming-seal)}
.app-header .brand{
  font-family:"Songti SC","STSong","SimSun",serif;
  letter-spacing:.08em;
}

/* 总览大卡：右上角朱砂印章（不占布局，纯装饰）
   注意实际 DOM 是 .ov-hero-copy（新版总览），不是旧版 .hero-copy——
   挂错选择器会得到一条永远不生效的装饰规则。 */
.ov-hero-copy{position:relative}
.ov-hero-copy::after{
  content:"明";
  position:absolute;right:22px;top:20px;
  width:52px;height:52px;display:grid;place-items:center;
  font-family:"Songti SC","STSong","SimSun",serif;font-size:30px;font-weight:700;
  color:#e8c9a4;border:2px solid rgba(232,201,164,.62);border-radius:3px;
  box-shadow:inset 0 0 0 3px rgba(52,44,37,.9);
  transform:rotate(-7deg);opacity:.85;pointer-events:none;
}
@media(max-width:640px){.ov-hero-copy::after{width:38px;height:38px;font-size:22px;right:14px;top:14px}}

/* 视图标题：朱砂竖批注线（旧 .section-head 与新版 .ov-head 都在用） */
.section-head h2,.ov-head h2{
  border-left:4px solid var(--ming-seal);
  padding-left:12px;
  font-family:"Songti SC","STSong","SimSun",serif;
  letter-spacing:.03em;
}

/* 面板：左上角一道淡朱痕，呼应线装书函套 */
.panel,.ov-panel{
  border-top:2px solid rgba(141,48,37,.22);
}

/* 时间轴年份：年号刻度感，等宽数字更整齐 */
.year-group h3{

}
.timeline{border-left-color:var(--ming-seal)}

/* 来源章节 chip：朱砂细边，强调「可回原书核对」 */
.source-chip{
  border-color:rgba(141,48,37,.30);
  background:linear-gradient(180deg,#fffdf8,#fbf5ea);
}

/* 帝王 / 年谱视图的年号标签 */
.dynasty-label.active{background:var(--ming-seal);color:#fff5ec}

/* 键盘焦点环复用朱砂，避免和主题脱节 */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{

/* 打印：纸张纹理一律去掉，别浪费墨、也别干扰人物卡打印 */
@media print{
  body{background-image:none!important;background-color:#fff!important}

  .ov-hero-copy::after{transform:none}
}

<script>
/* 启动守卫（P3-03）：主脚本内联了整份数据，一旦数据被裁剪或脚本执行抛错，
   页面会停在空白骨架且毫无提示。这里独立于主脚本先埋一个检查点：
   5 秒内若主脚本仍未置位 __MING_READY，就渲染一条可见的错误提示与重载入口。
   本段不依赖任何外部资源，也不受数据注入影响（注意：此处不得书写数据占位符
   本身，否则字典序注入会把整份 payload 塞进注释里，产物体积直接翻倍）。 */
window.__MING_BOOTERR='';
window.addEventListener('error',function(e){if(e&&e.message&&!window.__MING_BOOTERR)window.__MING_BOOTERR=e.message;});
setTimeout(function(){
  if(window.__MING_READY)return;
  var bar=document.createElement('div');
  bar.className='fail-bar fail-error';
  bar.setAttribute('role','alert');
  var msg=document.createElement('span');msg.className='fail-msg';
  msg.textContent='报告未能完成初始化'+(window.__MING_BOOTERR?'：'+String(window.__MING_BOOTERR).slice(0,160):'（内嵌数据可能缺失或被裁剪）')+'。可重新加载，或改用完整版文件打开。';
  var acts=document.createElement('span');acts.className='fail-acts';
  var btn=document.createElement('button');btn.type='button';btn.className='fail-act';btn.textContent='重新加载';
  btn.addEventListener('click',function(){location.reload();});
  acts.appendChild(btn);bar.appendChild(msg);bar.appendChild(acts);
  (document.body||document.documentElement).appendChild(bar);
},5000);
</script>
