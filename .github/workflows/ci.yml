name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法 · 不变量 · 构建冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 版权合规：统一由 tests/check_copyright.py 把关（名单 + .txt 体积 + json 内容特征），
      # 两本书合并进同一仓库后两边共用这一份实现，不会出现「一条改了另一条没改」。
      # 放最前面，失败即停。
      - name: 版权合规巡检
        run: python tests/check_copyright.py

      # 模块遮蔽巡检：任何 `.py` 若与标准库模块同名，会污染同目录脚本的 sys.path[0]，
      # 仅存在就能让「任何」Python 进程在启动时崩掉（2026-10-20 的 .dump/_bisect.py 事故）。
      # 必须排在一切 Python 步骤之前。
      - name: 模块遮蔽巡检
        run: python src/check_module_shadow.py

      - name: Python 语法检查
        run: python -m compileall -q src tests

      - name: 前端脚本语法检查
        run: node --check web/js/app.js

      # 测试与构建都不依赖 data/chapters.json（不入库的版权文件）：
      # 章节标题来自 data/extract_raw.json，缺 chapters.json 只会少字数统计。
      - name: 单元测试（共享核心 + 数据不变量 + 模板）
        run: python tests/run_tests.py

      - name: 构建冒烟（standalone，不落盘）
        run: python src/build.py --check

      - name: 聚合门户校验（不落盘）
        run: python src/build_hub.py --check

      # Pages 只发布白名单成品（index.html / standalone.html / sw.js / ming/ / books/），
      # 由 src/build_dist.py 挑拣。PR 阶段就跑一遍组装 + 门禁，
      # 免得合并后部署才发现发布面不对（比如有人把原著误放进 books/）。
      - name: 发布目录组装校验
        run: python src/build_dist.py --out .ci/site && python src/build_dist.py --check --out .ci/site

      # README 是生成物：模板在 src/sync_readme.py，数字来自工件数据。
      # 手改 README 而不改模板会让下次生成悄悄吃掉改动，故在此拦住。
      - name: README 与模板一致
        run: python src/sync_readme.py --check

      - name: 数据审计
        run: python src/audit_final.py --quick

      # 真实产物 + 无头浏览器自检：deep link / 搜索高亮 / tab 语义
      # （runner 上 Chrome 路径不固定，脚本会自己探测 CHROME_BIN 与常见路径）
      - name: 构建单文件产物
        run: python src/build.py --scope full --out .ci/index.html --quiet

      - name: 无头浏览器自检
        run: python tests/browser_check.py .ci/index.html
