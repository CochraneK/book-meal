<!DOCTYPE html>
<html lang="zh-CN" data-book="tiancai">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天才基本法 · 拆书知识库</title>
<style>
/* 拆书报告 · 样式（素纸亮色为默认，墨玉深色可选，按钮切换 + 记忆偏好） */
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #f0ede4;
  --ink: #2b2a26;
  --ink-2: #6b675c;
  /* #9a958a on #fff ≈ 3.0:1，低于 WCAG AA 4.5:1；#6f6a5f 白底 5.37 /
     米底 4.89 / panel-2 4.59，全部过 AA（ui_audit §3-5，2026-10-19 修） */
  --ink-3: #6f6a5f;
  --line: #ddd8cc;
  --accent: #8c4a2f;
  --accent-2: #2f5d8a;
  --gold: #b08a3e;
  --teal: #2f6f6a;
  --red: #a63a3a;
  --green: #3f7a4e;
  --shadow: 0 1px 3px rgba(40,35,25,.10), 0 6px 18px rgba(40,35,25,.06);
  --radius: 10px;
}
/* 亮色显式声明一份（与 :root 同值）：主题状态从此三态分明，
   不再靠「xuan 无规则 → 回落 :root」这种隐式兜底 */
body[data-theme="light"] {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #f0ede4;
  --ink: #2b2a26;
  --ink-2: #6b675c;
  --ink-3: #6f6a5f;
  --line: #ddd8cc;
  --accent: #8c4a2f;
  --accent-2: #2f5d8a;
  --gold: #b08a3e;
  --teal: #2f6f6a;
  --red: #a63a3a;
  --green: #3f7a4e;
  --shadow: 0 1px 3px rgba(40,35,25,.10), 0 6px 18px rgba(40,35,25,.06);
}
/* 墨玉深色 */
body[data-theme="dark"] {
  --bg: #14161a;
  --panel: #1c1f25;
  --panel-2: #23272f;
  --ink: #e8e4d8;
  --ink-2: #a8a496;
  --ink-3: #8f8b80;
  --line: #33383f;
  --accent: #d4795a;
  --accent-2: #6fa3d8;
  --gold: #d8b25e;
  --teal: #5fb3aa;
  --red: #d07070;
  --green: #6fa87a;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  font-size: 14px;
  line-height: 1.65;
}
#app { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }

/* ---------- 头部 ---------- */
.site-header { margin-bottom: 18px; }
.header-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.kicker { font-size: 12px; letter-spacing: .18em; color: var(--accent); font-weight: 600; }
h1 { font-size: 30px; margin: 4px 0 2px; font-weight: 700; letter-spacing: .02em; }
.subtitle { color: var(--ink-2); font-size: 13px; }
.header-stats { display: flex; gap: 10px; flex-wrap: wrap; }
/* 头部只留一行计数：标题旁五个大方块会把首屏重心拽回「后台看板」，
   数字的重量交给总览 hero，这里负责给其余 11 个视图提供上下文。 */
.header-stat-line { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.header-stat-line b { color: var(--ink-2); font-weight: 700; margin-right: 2px; }
.header-stat-line .sep { color: var(--ink-3); margin: 0 8px; }
.theme-toggle { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
.theme-toggle:hover { color: var(--ink); border-color: var(--accent); }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 14px; border-bottom: 2px solid var(--line); }
.tab { cursor: pointer; border: none; background: none; padding: 9px 16px; font-size: 14px;
  color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ---------- 视图通用 ---------- */
.view { display: none; padding-top: 18px; }
.view.active { display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.panel h3 .hint { font-weight: 400; font-size: 12px; color: var(--ink-3); margin-left: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-2); background: var(--panel-2); margin-right: 4px; }
.badge.src { color: var(--teal); border-color: var(--teal); }
.badge.manual { color: var(--gold); border-color: var(--gold); }
.badge.pending { color: var(--red); border-color: var(--red); }
.badge.schematic { color: var(--accent-2); border-color: var(--accent-2); }
.badge.real { color: var(--green); border-color: var(--green); }
.badge.kind-person { color: var(--accent-2); border-color: var(--accent-2); }
.badge.kind-place { color: var(--green); border-color: var(--green); }
.badge.kind-org { color: var(--gold); border-color: var(--gold); }
.badge.kind-regime { color: var(--red); border-color: var(--red); }
.badge.kind-other { color: var(--ink-3); }
/* 明察式可信度 / 性质徽章（学科视角视图用） */
.badge.cred-h { color: var(--green); border-color: var(--green); }
.badge.cred-m { color: var(--gold); border-color: var(--gold); }
.badge.cred-l { color: var(--red); border-color: var(--red); }
.badge.nature-real { color: var(--teal); border-color: var(--teal); }
.badge.nature-inf { color: var(--accent-2); border-color: var(--accent-2); }

.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
mark.hl { background: rgba(176,138,62,.35); color: inherit; padding: 0 1px; border-radius: 2px; }

/* ---------- 搜索框 ---------- */
.search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
.search-box input { flex: 1; border: none; outline: none; background: none; font-size: 14px;
  color: var(--ink); font-family: inherit; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { cursor: pointer; font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--panel); }

/* ---------- 人物卡（扑克牌 63×88mm） ---------- */
.card-grid { display: flex; flex-wrap: wrap; gap: 14px; }
.poke-card { width: 63mm; height: 88mm; perspective: 900px; cursor: pointer; }
.poke-inner { position: relative; width: 100%; height: 100%; transition: transform .5s;
  transform-style: preserve-3d; }
.poke-card.flipped .poke-inner { transform: rotateY(180deg); }
.poke-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6mm;
  border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow);
  padding: 5mm; display: flex; flex-direction: column; overflow: hidden; }
.poke-front { background: linear-gradient(150deg, var(--panel) 60%, var(--panel-2)); }
.poke-back { transform: rotateY(180deg); background: var(--panel); }
.poke-faction { font-size: 10px; color: var(--accent); letter-spacing: .08em; font-weight: 600; }
.poke-name { font-size: 20px; font-weight: 700; margin: 2mm 0; line-height: 1.2; }
.poke-one { font-size: 11px; color: var(--ink-2); flex: 1; overflow: hidden; }
.poke-foot { font-size: 10px; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 2mm; }
.poke-kv { font-size: 10.5px; margin-bottom: 1.2mm; }
.poke-kv b { color: var(--ink-2); font-weight: 600; }
.flip-hint { font-size: 9px; color: var(--ink-3); text-align: right; }
/* 卡背语录（A4）：卡片是名片尺寸，最多 3 行，超了截断——完整清单在详情弹窗 */
.poke-quote { font-size: 10px; line-height: 1.5; color: var(--ink-2); margin: 0 0 1.2mm;
  border-left: 2px solid var(--gold); padding-left: 2mm;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.poke-quote-src { display: block; font-size: 9px; color: var(--ink-3); margin-top: 1px; }

/* ---------- 实体分层（核心/主要/次要/龙套） ---------- */
.tier-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; flex-wrap: wrap; }
.tier-btn { font-family: inherit; }
.tier-btn.on { border-color: var(--accent); color: var(--accent); background: var(--panel); }
.tier-head { display: flex; align-items: baseline; gap: 6px; margin: 20px 0 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.tier-head b { font-size: 13px; letter-spacing: .04em; }
/* 龙套卡片弱化，避免和核心人物抢视线 */
.poke-card.tier-cameo .poke-front { opacity: .7; }
.poke-card.tier-cameo .poke-name { font-size: 17px; }

/* ---------- 关系基类图例 ---------- */
.rel-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 10px; font-size: 11px;
  color: var(--ink-2); }
.rel-legend span { display: inline-flex; align-items: center; gap: 5px; }
.rel-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
table.data th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap;
  position: sticky; top: 0; background: var(--panel); }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: var(--panel-2); }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.pager button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); border-radius: 6px; padding: 3px 10px; font-family: inherit; }
.pager button:disabled { opacity: .4; cursor: default; }

/* ---------- 启动失败 / 运行期错误条（ming 同款） ---------- */
.fail-host { position: fixed; top: 0; left: 0; right: 0; z-index: 80; display: flex; flex-direction: column; }
.fail-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between;
  padding: 10px 16px; font-size: 13px; border-bottom: 1px solid; }
.fail-bar.fail-error { background: #fdecea; color: #8a1f1f; border-color: #e0a39c; }
body[data-theme="dark"] .fail-bar.fail-error { background: #3a1f1f; color: #ffb4a8; border-color: #6e3a36; }
.fail-bar.fail-warn { background: #fff6e5; color: #8a6512; border-color: #e0c08a; }
body[data-theme="dark"] .fail-bar.fail-warn { background: #3a2f1a; color: #ffd58a; border-color: #6e5636; }
.fail-msg { flex: 1; }
.fail-acts { display: flex; gap: 8px; flex-shrink: 0; }
.fail-act { cursor: pointer; border: 1px solid currentColor; background: transparent; color: inherit;
  border-radius: 6px; padding: 3px 12px; font-family: inherit; font-size: 13px; }
.fail-act:hover { background: rgba(0,0,0,.06); }
body[data-theme="dark"] .fail-act:hover { background: rgba(255,255,255,.08); }

/* ---------- 图表（纯 SVG） ---------- */
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
/* flex 子项默认会被压缩：栏宽不足时 .lb 会从 90px 缩到 40px，把「日常生存」截成
   「日常生…」。标签本来就有固定宽度，这里禁掉收缩，压缩让给中间的轨道。 */
.bar-row .lb { flex: none; width: 90px; text-align: right; color: var(--ink-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { flex: 1; background: var(--panel-2); border-radius: 4px; height: 14px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 4px; }
.bar-row .val { width: 40px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- 地图 ---------- */
.map-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
@media (max-width: 900px) { .map-layout { grid-template-columns: 1fr; } }
.map-canvas { position: relative; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); min-height: 460px; overflow: hidden; }
.map-canvas svg { display: block; width: 100%; height: auto; }
.map-side { max-height: 520px; overflow-y: auto; }
.map-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px;
  cursor: pointer; background: var(--panel); font-size: 12.5px; }
.map-item:hover { border-color: var(--accent); }
.map-item .nm { font-weight: 600; }
.map-dot { cursor: pointer; }
.map-note { font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.zone-label { font-size: 12px; fill: var(--ink-3); }

/* ---------- 关系图 ---------- */
.graph-wrap { position: relative; }
.graph-wrap svg { width: 100%; height: 560px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--radius); }
.graph-node { cursor: pointer; }
.graph-node circle { stroke: var(--panel); stroke-width: 1.5; }
.graph-node text { font-size: 11px; fill: var(--ink); pointer-events: none; }
.graph-link { stroke: var(--line); stroke-opacity: .8; }
.rel-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 8px 0; }
.rel-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

/* ---------- 阶段轴 ---------- */
.phase-bar { display: flex; gap: 2px; margin-bottom: 6px; }
.phase-seg { flex: 1; text-align: center; font-size: 11px; color: var(--ink-2); cursor: pointer;
  border-radius: 6px 6px 0 0; padding: 6px 2px; border: 1px solid var(--line); border-bottom: none;
  background: var(--panel-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase-seg.on { background: var(--panel); color: var(--accent); font-weight: 600; border-color: var(--accent); }
.phase-body { border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
  background: var(--panel); padding: 14px 16px; }

/* ---------- 弹窗 ---------- */
.dialog-backdrop { position: fixed; inset: 0; background: rgba(20,18,14,.45); display: flex;
  align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.dialog-backdrop[hidden] { display: none; }
.dialog { background: var(--panel); border-radius: var(--radius); max-width: 640px; width: 100%;
  max-height: 86vh; overflow-y: auto; padding: 20px 22px; box-shadow: var(--shadow); position: relative; }
.dialog h2 { margin: 0 0 4px; font-size: 19px; }
.dialog .close-x { position: absolute; top: 10px; right: 12px; border: none; background: none;
  font-size: 20px; color: var(--ink-3); cursor: pointer; }
.kv-grid { display: grid; grid-template-columns: 88px 1fr; gap: 4px 12px; font-size: 13px; margin: 10px 0; }
.kv-grid dt { color: var(--ink-3); }
.kv-grid dd { margin: 0; }
.chip-link { cursor: pointer; color: var(--accent-2); border-bottom: 1px dotted var(--accent-2); }
.chip-link:hover { color: var(--accent); }

/* ---------- 提示条 ---------- */
.toast-bar { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60;
  background: var(--panel); border: 1px solid var(--gold); color: var(--ink); border-radius: 999px;
  padding: 8px 18px; font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; }
.toast-bar[hidden] { display: none; }
.toast-bar button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  border-radius: 999px; padding: 2px 12px; cursor: pointer; font-family: inherit; }

/* ---------- 回顶按钮 ---------- */
/* 故事/学科视角两个长文视图 7 万字单页滚动，目录在顶部，滚到中间后回不去
   （ui_audit §3-6）。滚动过 800px 才出现，不与 toast 抢位（回顶在右下）。 */
#back-top { position: fixed; right: 22px; bottom: 26px; z-index: 55;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
  border-radius: 999px; padding: 8px 16px; font-size: 13px; font-family: inherit;
  box-shadow: var(--shadow); cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity .2s ease; }
#back-top.show { opacity: 1; pointer-events: auto; }
#back-top:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- 深链定位闪烁 ---------- */
/* #person= / #phase= 分享链接打开时，目标卡片/阶段段脉冲高亮，回答「链在哪指」 */
@keyframes dl-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(176, 138, 62, 0); }
  50% { box-shadow: 0 0 0 7px rgba(176, 138, 62, .5); }
}
.poke-card.dl-flash { animation: dl-pulse .7s ease-in-out 3; outline: 2px solid var(--gold); }
.phase-seg.dl-flash { animation: dl-pulse .7s ease-in-out 3; outline: 2px solid var(--gold); outline-offset: 1px; }

/* ---------- 页脚 ---------- */
.site-footer { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px;
  font-size: 12px; color: var(--ink-3); }
.site-footer b { color: var(--ink-2); }

/* ---------- 总览：结论先行 ---------- */
/* 先给判断，再给数字。左边一道细线区分「结论」与「证据」两层。 */
.findings { display: grid; gap: 12px; margin-top: 8px; }
.finding { border-left: 2px solid var(--gold); padding-left: 12px; }
.finding .claim { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.5; }
.finding .ev { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.65; }

/* ---------- 金句 ---------- */
/* 句子是主角，元信息退到第二层：正文 15px，出处 11.5px 且降饱和。
   叙述句用斜体 + 弱化色，与人物台词在视觉上就能分开，不必逐条读标签。 */
.q-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 26px; }
@media (max-width: 900px) { .q-grid { grid-template-columns: 1fr; } }
.q-item { border-left: 2px solid var(--line); padding: 5px 0 5px 12px; }
.q-text { font-size: 15px; line-height: 1.75; }
.q-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
/* 详情弹窗里的语录：比金句页更紧凑，且多条并列 */
.q-inline { padding: 4px 0 4px 10px; margin-bottom: 6px; }
.q-inline .q-text { font-size: 12.5px; }
.q-meta .who { color: var(--accent-2); cursor: pointer; font-weight: 600; }
.q-meta .who:hover { color: var(--accent); }
.q-narr { border-left-color: var(--gold); }
.q-narr .q-text { color: var(--ink-2); font-style: italic; }
.q-person { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px;
  padding-bottom: 5px; border-bottom: 1px dashed var(--line); }
.q-person:first-child { margin-top: 0; }
.q-person .nm { font-size: 15px; font-weight: 700; cursor: pointer; }
.q-person .nm:hover { color: var(--accent); }

/* ---------- 打印 ---------- */
@media print {
  body { background: #fff; }
  .site-header, .tabs, .toast-bar, .dialog-backdrop, #back-top { display: none !important; }
  .view { display: block !important; page-break-after: always; }
  /* 「打印本页卡片」收窄作用域：只输出 #print-area 里的卡片，
     不再顺带打出其余 10 个视图（此前实测 69 页 / 10.8MB）。
     直接 Ctrl+P 未加此类，仍是完整手册模式。 */
  body.printing-cards #app { display: none !important; }
  .poke-card { break-inside: avoid; }
  .poke-card .poke-inner { transform: none !important; }
  .poke-face { position: relative; inset: auto; transform: none !important;
    backface-visibility: visible; page-break-inside: avoid; }
  .poke-card { width: 63mm; height: auto; perspective: none; margin-bottom: 4mm; }
}

/* ---------- 故事长文 ---------- */
/* 长文是给人读的，排版要让位给阅读：正文限宽（约 40 个汉字一行），
   行高放到 1.9，段间距明确。元信息（口径/目录）用面板卡片，正文用 .story。
   章号链接做成弱化的虚线下划线，不抢正文，但一眼看得出可点。 */

/* 论文视图：左侧篇目列表 + 右侧正文（沿用 .story 的正文排版） */
.paper-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: 8px; margin-top: 12px; }
.paper-item { display: flex; flex-direction: column; gap: 3px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 11px; cursor: pointer; font-family: inherit; color: var(--ink);
  transition: border-color .15s, background .15s, transform .15s; }
.paper-item:hover { transform: translateY(-1px); border-color: var(--gold); }
.paper-item.on { background: var(--panel); border-color: var(--accent);
  box-shadow: var(--shadow); }
.paper-item b { font-size: 13px; line-height: 1.45; font-weight: 600; }
.paper-item span { font-size: 11px; font-style: italic; color: var(--ink-3); line-height: 1.4; }
.paper-item em { font-size: 11px; font-style: normal; color: var(--ink-3); }
.paper-item.on em { color: var(--accent); }
@media print { .paper-list { display: none !important; } }

.story { font-size: 15.5px; line-height: 1.9; color: var(--ink); }
.story > * { max-width: 46em; margin-left: auto; margin-right: auto; }
.story > .table-wrap { max-width: 100%; }
.story h1 { font-size: 26px; line-height: 1.4; margin: 6px 0 14px; }
.story h2 { font-size: 20px; line-height: 1.5; margin: 34px 0 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line); }
.story h3 { font-size: 17px; margin: 26px 0 8px; color: var(--ink); }
.story h4 { font-size: 15px; margin: 20px 0 6px; color: var(--ink-2); }
.story p { margin: 0 0 14px; }
.story strong { font-weight: 700; }
.story em { font-style: italic; color: var(--ink-2); }
.story code { font-family: Consolas, "Courier New", monospace; font-size: .88em;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.story blockquote { margin: 16px 0; padding: 12px 16px; background: var(--panel-2);
  border-left: 3px solid var(--gold); border-radius: 0 var(--radius) var(--radius) 0; }
.story blockquote p { margin: 0 0 6px; }
.story blockquote p:last-child { margin-bottom: 0; }
.story ul, .story ol { margin: 0 0 14px; padding-left: 1.6em; }
.story li { margin: 0 0 7px; }
.story hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
.story .table-wrap { margin: 14px 0 18px; }
.story table.data { font-size: 13px; }
.story table.data td { vertical-align: top; }
.story a.ch-ref { color: var(--accent-2); text-decoration: none;
  border-bottom: 1px dotted var(--accent-2); cursor: pointer; padding: 0 1px; }
.story a.ch-ref:hover { color: var(--accent); border-bottom-color: var(--accent);
  background: var(--panel-2); }
/* 阶段引用链接（学科视角 → 阶段轴）：虚线，与章号链接的点线区分 */
.story a.ph-ref { color: var(--accent-2); text-decoration: none;
  border-bottom: 1px dashed var(--accent-2); cursor: pointer; padding: 0 1px; }
.story a.ph-ref:hover { color: var(--accent); border-bottom-color: var(--accent);
  background: var(--panel-2); }
/* 学科视角 ↔ KG 实体联动：正文里的可点实体（点线，与阶段链接的虚线区分） */
.story button.ins-link { font: inherit; padding: 0 1px; background: none; border: 0;
  border-bottom: 1px dotted var(--accent-2); color: var(--accent-2); cursor: pointer; }
.story button.ins-link:hover { color: var(--accent); border-bottom-color: var(--accent);
  background: var(--panel-2); }
.story button.ins-link.ins-l { color: var(--teal); border-bottom-color: var(--teal); }
.story button.ins-link.ins-e { color: var(--gold); border-bottom-color: var(--gold); }
/* 反向入口：详情弹窗里的「相关分析」chip */
.ins-block { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.ins-label { font-size: 12px; color: var(--ink-3); margin-right: 6px; }
button.ins-chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px;
  font-size: 12px; line-height: 1.6; cursor: pointer; border-radius: 999px;
  color: var(--accent-2); background: var(--panel-2); border: 1px solid var(--line); }
button.ins-chip:hover { color: #fff; background: var(--accent-2); border-color: var(--accent-2); }
.ins-flash { animation: insFlash 2.6s ease-out; }
@keyframes insFlash { 0%, 60% { background: rgba(212,121,90,.22); } 100% { background: transparent; } }
/* 目录：两级缩进，点击跳正文锚点 */
.story-toc { display: flex; flex-direction: column; gap: 2px; }
.story-toc-item { color: var(--ink-2); text-decoration: none; font-size: 13.5px;
  padding: 4px 8px; border-radius: 6px; line-height: 1.5; }
.story-toc-item:hover { background: var(--panel-2); color: var(--accent); }
.story-toc-item.lv3 { padding-left: 26px; font-size: 12.5px; color: var(--ink-3); }

/* ---------- 总览 ---------- */
/* 首屏层级：一句话导读 + 边界标签 → 五个数字（每个带口径小字）
   → 章节节奏 / 事件功能 → 五句结论 → 折叠的「数据体检」。
   统一字号阶梯：数字 30 / 面板标题 14 / 正文 13.5 / 辅助 11.5 / 轴标 10.5。
   此前总览用了 9 种散乱字号，读起来像后台管理页，改版后收敛到 5 级。 */
.ov-head { margin: 0 0 14px; }
.ov-lede { font-size: 14px; line-height: 1.8; color: var(--ink-2); max-width: 70ch; }
.ov-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.ov-flag { font-size: 11.5px; line-height: 1.7; color: var(--ink-2); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }

.ov-hero { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.ov-stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 15px 11px; box-shadow: var(--shadow); }
.ov-stat .v { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em;
  color: var(--ink); font-variant-numeric: tabular-nums; }
.ov-stat .l { font-size: 12px; color: var(--ink-2); margin-top: 5px; letter-spacing: .06em; }
.ov-stat .s { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

.ov-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.ov-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 17px 13px; box-shadow: var(--shadow); margin-bottom: 16px; }
.ov-row > .ov-panel { margin-bottom: 16px; }
.ov-panel h3 { margin: 0 0 10px; font-size: 14px; }
/* .panel h3 .hint 的规则挂不到 .ov-panel 上：体检区标题里的说明会跟标题粘成一串 */
.ov-panel h3 .hint { font-weight: 400; font-size: 12px; color: var(--ink-3); margin-left: 8px; }
/* 审计表只有两列（名称 / 数字），铺满 700px 会把数字推到屏幕外，
   中间留一条 400px 的空白视线——限宽后数字才跟标签在同一眼里。 */
.ov-audit-body table.data { max-width: 460px; }
.ov-audit-body .ov-row { grid-template-columns: 1fr 1fr; }
/* 体检表里只有 Top12 的人物行可点，其余行别给手型光标（否则像死按钮） */
.ov-audit-body table.data tbody tr:not([data-person]) { cursor: default; }
.ov-audit-body .bar-row { margin-bottom: 5px; }
.ov-panel-head { display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ov-panel-head h3 { margin: 0; }
.ov-panel-head .hint { font-size: 11.5px; color: var(--ink-3); }

/* 章节节奏：柱子高度 = 每章事件数，颜色 = 所属叙事线（点图例可跳阶段轴）。
   柱子之间不留缝：221~439 根柱在 500px 里每根只有 1~2px，留 1px 缝会让
   30% 的面积变成底色，看上去像一层灰纱；同色相邻柱直接连成色块反而更清楚。 */
.ov-spark { display: flex; align-items: flex-end; gap: 0; height: 96px; }
.ov-spark i { flex: 1 1 0; min-width: 1px; display: block; border-radius: 1px 1px 0 0;
  opacity: .9; transition: opacity .12s; }
.ov-spark i:hover { opacity: 1; }
.ov-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3);
  margin-top: 5px; padding-top: 4px; border-top: 1px solid var(--line); }
.ov-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 11px;
  color: var(--ink-2); }
.ov-legend button { display: inline-flex; align-items: center; gap: 5px; border: none;
  background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.ov-legend button:hover { color: var(--accent); }
.ov-legend button i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.ov-legend button.ov-more { color: var(--accent); }

/* 事件功能：名称 / 轨道 / 占比，三列对齐，扫一眼就能看出主次 */
.ov-figs { display: grid; gap: 7px; }
.ov-fig { display: grid; grid-template-columns: 68px 1fr 34px; align-items: center; gap: 8px;
  font-size: 12px; }
.ov-fig .nm { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-fig .tr { height: 9px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.ov-fig .tr span { display: block; height: 100%; border-radius: 3px; }
.ov-fig .vl { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ov-note { font-size: 11px; color: var(--ink-3); line-height: 1.6; margin-top: 11px;
  padding-top: 8px; border-top: 1px dashed var(--line); }

/* 结论先行：五句话两列排，左侧一道金色竖线标出「这是判断」 */
.ov-claims { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.ov-claim { border-left: 2px solid var(--gold); padding-left: 12px; }
.ov-claim .c { font-size: 13.5px; font-weight: 600; line-height: 1.55; color: var(--ink); }
.ov-claim .e { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.65; }

/* 数据体检：审计口径全部保留，只是默认收起，不占第一屏 */
.ov-audit { margin-top: 2px; }
.ov-audit-bar { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  cursor: pointer; font-family: inherit; color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 15px; }
.ov-audit-bar:hover { border-color: var(--accent); }
.ov-audit-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ov-audit-t { font-size: 13.5px; font-weight: 600; flex: none; }
.ov-audit-d { flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-caret { flex: none; font-size: 11.5px; color: var(--accent); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.ov-audit-body { display: none; padding-top: 16px; }
.ov-audit-body.open { display: block; }
.ov-about { margin: 2px 0 6px; font-size: 13.5px; line-height: 1.75; }

@media (max-width: 1000px) {
  .ov-row { grid-template-columns: 1fr; }
  .ov-hero { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .ov-hero { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ov-stat { padding: 11px 12px 9px; }
  .ov-stat .v { font-size: 24px; }
  .ov-claims { grid-template-columns: 1fr; }
  .ov-spark { height: 76px; }
}

/* ============================================================
   书影工坊 · 主题皮肤：天才基本法
   气质：理性 · 温暖 · 学术校园。主色学术蓝 + 暖琥珀，方格纸肌理。
   作用于 html[data-book="tiancai"]，仅覆写变量与少量母题，不碰布局逻辑。
   ============================================================ */

/* ---- 亮色盘（default / data-theme=light）---- */
html[data-book="tiancai"] body {
  --bg: #eef2f8;
  --panel: #ffffff;
  --panel-2: #e6edf6;
  --ink: #1d2a3a;
  --ink-2: #46566a;
  --ink-3: #6a7a8c;

  --accent: #2f5d8a;        /* 学术蓝（主） */

  --gold: #b5742e;
  --teal: #2f7d72;          /* 地点：青绿 */

/* ---- 暗色盘 ---- */
html[data-book="tiancai"] body[data-theme="dark"] {

}

/* ---- 签名母题：方格纸肌理 ---- */
html[data-book="tiancai"] body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(47,93,138,.10) 1px, transparent 1px),

/* ---- 局部重构：标题与英雄区 ---- */
html[data-book="tiancai"] .kicker {
  letter-spacing: .22em;
  color: var(--accent);
}
html[data-book="tiancai"] h1 {
  letter-spacing: .04em;
}
/* 顶部一道学术蓝细线，呼应「知识图谱」的冷静理性 */
html[data-book="tiancai"] .site-header {
  border-top: 3px solid var(--accent);
  padding-top: 14px;
}
/* 英雄区数字卡：左缘学术蓝描边 */
html[data-book="tiancai"] .ov-stat {
  border-top: 2px solid var(--accent);
}
/* 面板标题：学术蓝竖线，区分「结论 / 证据」 */
html[data-book="tiancai"] .panel h3,
html[data-book="tiancai"] .ov-panel h3 {

/* 章节节奏柱 / 事件功能轨道：主色学术蓝 */

html[data-book="tiancai"] .ov-fig .tr span { background: var(--accent); }
/* 人物卡正面上缘学术蓝渐隐，呼应粉笔标题 */
html[data-book="tiancai"] .poke-front {
  background: linear-gradient(160deg, rgba(47,93,138,.06), var(--panel) 55%);
}
html[data-book="tiancai"] .poke-faction { color: var(--accent); }
/* 故事长文：引文块用学术蓝而非金，统一冷调 */
html[data-book="tiancai"] .story blockquote { border-left-color: var(--accent); }
html[data-book="tiancai"] .finding,
html[data-book="tiancai"] .ov-claim { border-left-color: var(--accent); }

</style>

<script>
/* 主题在首次绘制前定好，避免亮→暗闪烁；与 app.js 的 applyTheme 同源同键 */
try {
  var t = localStorage.getItem("kg-report-theme");
  if (t === "dark" || t === "light") {
    document.body.dataset.theme = t;
  } else {
    /* 暗色气质的书（废土 / 天幕）默认进深色，其余跟系统偏好 */
    var _book = document.documentElement.dataset.book;
    var _darkDefault = (_book === "feitu" || _book === "swdw");
    document.body.dataset.theme = (_darkDefault ||
      matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
} catch (e) { document.body.dataset.theme = "light"; }
</script>
<script>
/* 启动守卫（与 ming 同款）：主脚本置于页面底部，一旦内嵌数据被裁剪或脚本执行抛错，
   页面会停在空白骨架且毫无提示。这里独立于主脚本先埋一个检查点：
   5 秒内若主脚本仍未置位 __KG_READY，就渲染一条可见的错误提示与重载入口。
   本段不依赖任何外部资源，也不读取数据内容，故不受数据注入影响。 */
window.__KG_READY = false;
window.__KG_BOOTERR = "";
window.addEventListener("error", function (e) {
  if (e && e.message && !window.__KG_BOOTERR) window.__KG_BOOTERR = e.message;
});
setTimeout(function () {
  if (window.__KG_READY) return;
  var host = document.getElementById("failHost");
  if (!host) {
    host = document.createElement("div");
    host.id = "failHost";
    host.className = "fail-host";
    document.body.appendChild(host);
  }
  var bar = document.createElement("div");
  bar.className = "fail-bar fail-error";
  bar.setAttribute("role", "alert");
  var msg = document.createElement("span");
  msg.className = "fail-msg";
  msg.textContent = "报告未能完成初始化" +
    (window.__KG_BOOTERR ? "：" + String(window.__KG_BOOTERR).slice(0, 160) : "（内嵌数据可能缺失或被裁剪）") +
    "。可重新加载，或改用完整版文件打开。";
  var acts = document.createElement("span");
  acts.className = "fail-acts";
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "fail-act";
  btn.textContent = "重新加载";
  btn.addEventListener("click", function () { location.reload(); });
  acts.appendChild(btn);
  bar.appendChild(msg);
  bar.appendChild(acts);
  host.appendChild(bar);
}, 5000);
</script>

是文学评论，是<strong>故事复述</strong>。所有情节都来自本项目对原文抽取的 833 条事件（100% 带原文摘要），每条可回原文核对。本文只做取舍、连缀与措辞，<strong>不补充素材里没有的情节</strong>；凡素材未覆盖处，明确标注「未收录」。</p></blockquote>\n<hr>\n<h2 id=\"0-先说结构这本书不能按章号顺着讲\">0. 先说结构：这本书不能按章号顺着讲</h2>\n<p>三条线叠在一起：</p>\n<ol><li><strong>现实线</strong>——22 岁，哲学系大四实习生林朝夕，父亲老林确诊早发性阿尔茨海默，暗恋的裴之即将出国。</li><li><strong>芝士世界</strong>——12 岁，红星福利院孤儿，老林是公园门卫，与她没有父女缘分。</li><li><strong>穿越本身</strong>——触发物是一面墙上的一道公式。</li></ol>\n<p>本项目对两本书的对白做过重复率统计：<strong>天才基本法的对白重复率 43.1%</strong>（《我在废土世界扫垃圾》只有 3.9%）。原因是同一场景在平行世界里反复重演——最典型的是「心算王骗局」，KG 在 <strong>16 个章号</strong>里都记到了它（签名「张老师、林朝夕 · 冲突对峙」）。</p>\n<p>场景重演表的签名是「核心人物 + 事件类型」，因为重演的事件<strong>名字往往不同</strong>。所以本文的策略是：<strong>同一场景只讲一次</strong>，然后把它在哪些章被重演列在后面。按章号平铺，等于把同一个故事讲十六遍。</p>\n<p>另一处需要预先说明的口径：抽取器给出的索引最大到 224，而 <code>chapters.json</code> 登记 221 章。差值是源文本防盗章造成的编号漂移——索引 112 之后，索引比正文标题的章号大 3。<strong>本文一律使用正文标题的章号。</strong></p>\n<hr>\n<h2 id=\"1-一句话版本\">1. 一句话版本</h2>\n<p>一个 22 岁的女儿，为了患阿尔茨海默的父亲，在一面墙上写下父亲教她的第一个公式，回到了 12 岁——在平行世界里重新长大一次，把父亲当年给她的东西，一样一样还给他。</p>\n<hr>\n<h2 id=\"2-现实线22-岁的崩塌\">2. 现实线：22 岁的崩塌</h2>\n<p>故事从确诊开始。第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"1\">1</a>章《真实》，父女俩对早发性阿尔茨海默早有预感，确诊日相对平静。同一天里还压着两件事：</p>\n<ul><li>裴之要出国了，去的正是老林当年放弃的那所学校（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"1\">1</a>章）。</li><li>大学城高校联合智力竞赛选题会，林朝夕<strong>一分钟</strong>从 100 道备选大题里报出 10 道：31/38/44/56/58/62/63/64/70/77，其中 77 题（黑白棋子）被定为压轴（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"2\">2</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"28\">28</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"66\">66</a>章）。</li></ul>\n<p>她的数学一直都在。第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"4\">4</a>章《遥遥》，裴之在黑板上写建模入门题（哈密尔顿回路/分类题），她抄下来还写了自己的思路；裴之读完她随手写的草稿，读出「fisher 线性判别函数」「完全解的分类」，说「已经很不错」。也是这一章，裴之不到半秒写出智力竞赛压轴题的答案 <strong>16</strong>。</p>\n<p>但老林一眼看穿：这道题是裴之的导师沈教授出的，<strong>投石问路的石子，指向 P/NP 问题</strong>（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"27\">27</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"64\">64</a>章）。他劝女儿考数学系研究生——解 P/NP 能加速疾病攻克，「何时开始都不晚」。</p>\n<p>与此同时，教务主任在催婚。相亲对象小刘，父母是局长。林朝夕以父亲刚确诊为由一次次婉拒（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"2\">2</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"28\">28</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"31\">31</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"37\">37</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"41\">41</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"66\">66</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"135\">135</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"163\">163</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"168\">168</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"170\">170</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"208\">208</a>章，共 11 章）；老林却从教务主任——他同学——那里得知了相亲，严厉质问女儿的人生规划（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"27\">27</a>章；同一质问在 KG 里共 8 个章号）。</p>\n<p>老林的病同时在日常生活中显形：扔垃圾忘拿钥匙、忘带手机、忘约烧烤、忘关火。林朝夕深夜查阿尔茨海默照护资料，记下怀旧物品、门上特殊标记、换指纹锁三个要点，脚边备一整盒粉笔（照护要点见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"6\">6</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"36\">36</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"51\">51</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"52\">52</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"56\">56</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"60\">60</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"84\">84</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"91\">91</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"101\">101</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"119\">119</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"130\">130</a>章；整盒粉笔见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"51\">51</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"56\">56</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"60\">60</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"84\">84</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"91\">91</a>章）。</p>\n<p>然后是全书最重要的一段对话。打卤面店，雨天中午，老林偷点炸猪排被女儿拦下，用玩笑化解确诊的沉重：</p>\n<blockquote><p>「我的病是我的病，你的人生是你的人生。」</p></blockquote>\n<p>这句话在 KG 里出现在<strong>七个章号</strong>（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"61\">61</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"63\">63</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"123\">123</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"127\">127</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"137\">137</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"173\">173</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"197\">197</a>章）——又是平行世界的重演。同一场景里，老林还讲了他为抚养女儿放弃出国学数学（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"197\">197</a>章《母亲》）。</p>\n<p>那天深夜，她带着一整盒粉笔站在院墙外（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"51\">51</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"56\">56</a>章），在自家院墙和门板上写下父亲当年教她的第一个公式——<strong>E=mc²</strong>（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"6\">6</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"36\">36</a>章）。</p>\n<hr>\n<h2 id=\"3-芝士世界12-岁的开局\">3. 芝士世界：12 岁的开局</h2>\n<p>写完公式，姿势未变，墙、门、野猫全非，手臂变短变黑变胖（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"207\">207</a>章《报告》）。她回到了小学五年级，成了<strong>红星福利院的孤儿</strong>——这个世界里，老林没有和她结父女缘分（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"7\">7</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"101\">101</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"207\">207</a>章）。</p>\n<p>开局条件极差：</p>\n<ul><li>地段小学是红星小学，市实验小学进不去。她穿着洗旧的红星小学校服隔铁栏杆张望母校，被门卫挥手赶走（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"28\">28</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"63\">63</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"185\">185</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"205\">205</a>章）。</li><li>旧居专诸巷小院还在，房间整洁无人，没有女孩生活的痕迹。她从烈日守到夕阳，推断老林或许已出了国（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"8\">8</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"45\">45</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"75\">75</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"83\">83</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"99\">99</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"100\">100</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"105\">105</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"120\">120</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"124\">124</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"159\">159</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"172\">172</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"183\">183</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"185\">185</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"205\">205</a>章，共 14 章）。</li><li>院长党爱萍打遍医院和交警队的电话确认她安全，只说「没事就好，回去吧」（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"8\">8</a>章）。</li></ul>\n<p>唯一的上升通道是<strong>晋江杯小学生奥数竞赛安宁赛区夏令营选拔赛</strong>：考上夏令营才能参赛，得名次可保送好初中；考上夏令营总分加 10 分、代表参赛加 20 分（保送规则见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"126\">126</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"180\">180</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"193\">193</a>章；加分规则见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"53\">53</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"112\">112</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"189\">189</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"197\">197</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"209\">209</a>章）。对福利院的孩子，这是改变人生的一条路。</p>\n<p>于是她被两件事同时推着走。</p>\n<h3 id=\"31-不被送走\">3.1 不被送走</h3>\n<p>张教授夫妇收养了先天拇指缺陷的林爱民，还剩一个名额，决定连她一并收养——<strong>用陈述句，不是征求意见</strong>（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"16\">16</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"34\">34</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"87\">87</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"89\">89</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"110\">110</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"128\">128</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"146\">146</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"155\">155</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"161\">161</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"176\">176</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"184\">184</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"191\">191</a>章，共 12 章）。林朝夕援引收养法「年满 10 周岁需本人同意」拒绝，被党院长一句「我也不同意你的不同意」回绝（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"155\">155</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"191\">191</a>章）。她提出赌约：</p>\n<blockquote><p><strong>拿到晋杯省团体赛冠军，就不送她走</strong>，并且未来可以自由选择想去的家庭。</p></blockquote>\n<p>这个赌约在 KG 里出现在 10 个章号（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"16\">16</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"34\">34</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"49\">49</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"87\">87</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"89\">89</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"110\">110</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"128\">128</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"155\">155</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"161\">161</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"191\">191</a>章），是全书重复率最高的叙事动作。</p>\n<h3 id=\"32-找到老林\">3.2 找到老林</h3>\n<p>她抱着腿喊「师父」，老林不认；她喊出「专诸巷 284 号」，老林猛回头震惊——<strong>220 与 284 是一对亲和数，而她 2 月 20 日出生</strong>。毕达哥拉斯说朋友是灵魂的倩影；老林租这个房子，是数学的浪漫（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"15\">15</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"40\">40</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"46\">46</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"80\">80</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"129\">129</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"177\">177</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"187\">187</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"195\">195</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"211\">211</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"212\">212</a>章，共 10 章）。</p>\n<p>这一段的日常是全书最结实的地面：老林跳上环卫小船撑竹竿捞垃圾，她在岸边复习流水行船；门卫室抽屉里有纱布和酒精棉花，他扔给她让她自己擦膝盖；她找不到米和锅，他冲进厨房自己生火做饭，然后把她连人带书包扔出门。老林的态度在「你好烦→滚→怕你了→求你了→滚」之间循环，但每天做早饭（态度循环见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"87\">87</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"89\">89</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"110\">110</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"146\">146</a>章；做早饭又把她扔出门见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"110\">110</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"191\">191</a>章）。</p>\n<h3 id=\"33-心算王骗局讲一次\">3.3 心算王骗局（讲一次）</h3>\n<p>公园门口，一个戴金边眼镜的男人摆摊卖 100 元一套的「心算速成」秘籍，小黑板上写着 13×13×13=2197，雇托制造抢购气氛，专骗望子成龙的爷爷奶奶。林朝夕当众拆穿——同样的书，亚瑟·本杰明与迈克尔·谢尔顿合著，新华书店只要 175 元；并当场演示立方公式与指关节计数法。</p>\n<p>心算王反手出一道 92960675÷78 想难住她，人群外响起一个男孩清晰平静的声音：<strong>1191803525641</strong>。裴之。随后他反出一道 1234×7890973260-5183144-1071246，心算王答不出；老林脱口而出「等于 0」，暴露了数学能力，被远处的陆志浩崇拜地喊「叔叔好厉害」（这场戏在 KG 里最完整的记录是第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"175\">175</a>章——叫卖、拆穿、指关节计数法、「1191803525641」、老林「等于 0」、陆志浩「叔叔好厉害」俱全；「1191803525641」另见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"12\">12</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"51\">51</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"63\">63</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"166\">166</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"188\">188</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"198\">198</a>章；「等于 0」与「叔叔好厉害」另见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"103\">103</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"117\">117</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"192\">192</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"203\">203</a>章）。</p>\n<blockquote><p><strong>重演位置</strong>：签名「张老师、林朝夕 · 冲突对峙」，共 <strong>16 章</strong>——第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"12\">12</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"13\">13</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"32\">32</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"51\">51</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"71\">71</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"81\">81</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"93\">93</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"103\">103</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"107\">107</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"117\">117</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"144\">144</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"175\">175</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"182\">182</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"188\">188</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"190\">190</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"214\">214</a>章。</p></blockquote>\n<h3 id=\"34-学校里的两场仗\">3.4 学校里的两场仗</h3>\n<p>第一场对<strong>曾珊珊</strong>——用「没有写解题过程」给她打叉、质疑她抄袭的批卷同学。她的辩护每次都一样：晋杯赛 10 题、4 填空 6 选择、不要求过程，巧算强算皆合理。班主任许安比对两份卷子，发现陆志浩的第 10 题空着而她答对了，由此排除抄袭，判她满分（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"11\">11</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"43\">43</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"55\">55</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"74\">74</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"102\">102</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"111\">111</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"116\">116</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"174\">174</a>章）。</p>\n<p>第二场对<strong>陆志浩</strong>——许老师的儿子，第一仇敌，骂过她「没爹妈的神经病」，被亲妈责令当众道歉（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"10\">10</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"35\">35</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"73\">73</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"77\">77</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"82\">82</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"156\">156</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"157\">157</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"162\">162</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"185\">185</a>章，共 9 章）。但他也是第一个护短的人：抄好知识点表格送她，报酬是一包跳跳糖（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"42\">42</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"70\">70</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"151\">151</a>章）。</p>\n<h3 id=\"35-选拔考\">3.5 选拔考</h3>\n<p>全市一两千人参考，有准考证编号、统一阅卷。她约 20 分钟做完 10 题，压轴题是循环小数 0.abc 的容斥原理，<strong>答案 660</strong>，提前交卷；监考老师好心劝她再检查（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"18\">18</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"44\">44</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"53\">53</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"112\">112</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"167\">167</a>章）。</p>\n<p>后来老林确认：最后一题答案 660 正确，全对，意味着可以进夏令营。她在公园里扑进老林怀里大哭，老林买了一块白雪方砖（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"19\">19</a>章）。</p>\n<hr>\n<h2 id=\"4-夏令营巴什博弈与规则漏洞\">4. 夏令营：巴什博弈与规则漏洞</h2>\n<p>雏鹰假日小队，两队抢清洁任务。章亮的妈妈以名校娇气为由，想把重活推给红星小学。章亮说「学生无贵贱但脑子有」，要用游戏证明红星小学的孩子适合做清洁（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"20\">20</a>章）。</p>\n<p>游戏是取子：17 颗石子，每次取 1–3 颗。林朝夕先手取 1 剩 16，必胜——这是巴什博弈。章亮改规则换取 4 颗，再换取 1–5、100 多颗，约定以旋转木马（击鼓传花）停止时停止换规则。她看裴之后镇定，数清 229 颗找到获胜点；章亮失误让出胜利，她静等木马停，裴之判定她赢（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"21\">21</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"22\">22</a>章）。</p>\n<p>当晚老林教组合游戏与巴什博弈，两校孩子围观抢答；他和裴之多局 nim 对决，说裴之「绝对聪明却绝对慢」（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"23\">23</a>章）。</p>\n<p>夏令营入学测验是个下马威：领队让带行李爬 7 楼参加考试，称最后五名淘汰。裴之识破规则漏洞——没有固定开始时间，只需 12 点前结束——提议留十分钟看大家行李，先上楼考完再交换。林朝夕 11:15 开考、11:43 交卷，放弃三道难题抢简单题，给裴之留出时间（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"25\">25</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"26\">26</a>章）。</p>\n<hr>\n<h2 id=\"5-老林是谁\">5. 老林是谁</h2>\n<p>这是全书的情感核心，也是 KG 记录最密集的一条线。</p>\n<p><strong>他放弃过什么。</strong> 老林当年考上了国外那所大学——就是裴之后来要去的那所（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"1\">1</a>章）。为了抚养女儿，他放弃了出国学数学（第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"61\">61</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"137\">137</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"197\">197</a>章）。</p>\n<p><strong>她是怎么来的。</strong> 第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"210\">210</a>章《奔走》，老林讲出出生往事：国立永川大学数学系同学，舞厅一夜情，母亲生下她后离开。</p>\n<p><strong>车祸。</strong> 第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"109\">109</a>章《变化》，她的书包里装满老林车祸前后密密麻麻的回忆，考虑用做梦的办法提前警告父亲不要离开。第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"114\">114</a>章《假设》，她写下三行假设——1. 假设车祸必发生；2. 时间地点不变；3. 如何救——最终卡在「不知道」。（KG 未收录车祸本身的事件条目，此处只复述这两章的思考过程。）</p>\n<p><strong>他的数学从来没有消失。</strong> 他用红砖在院墙上写满公式——质能方程、广义相对论场方程、狄拉克方程——教育一个炫耀背公式的男孩：「请称呼它为宇宙。」他缴了心算王的书，在几乎每一页上改错、调序、批注、列表格，几近重写，然后当作「祖传秘诀传女不传男」送给她。林朝夕翻着那本书，看到的是老林的寂寞和对数学的爱（红砖公式见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"6\">6</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"36\">36</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"56\">56</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"101\">101</a>章；批注版秘籍见第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"65\">65</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"70\">70</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"200\">200</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"202\">202</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"215\">215</a>章）。</p>\n<p><strong>他最终拿回了自己的名字。</strong> 第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"221\">221</a>章《尾声》：</p>\n<ul><li>老林的<strong>图同构论文推翻了冯教授的论证</strong>，老同学认出研究方向后，追查出他当年被开除的内情；</li><li>老门卫<strong>张大明</strong>临终前写信，说明冯教授当年在传达室拿走了老林国外大学的录取通知书并矢口否认，其子将信送到学校；</li><li>永川大学<strong>处分冯教授</strong>，并在博士研究生开学典礼上，因特别杰出的科研成果<strong>破格授予林兆生博士学位</strong>。校长致辞：「真理与热爱除外」。</li></ul>\n<hr>\n<h2 id=\"6-结局\">6. 结局</h2>\n<p>第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"221\">221</a>章《尾声》是全书的收束，KG 在这里记了 15 条事件：</p>\n<ul><li>林朝夕每天在考研教室学到下午五点，再到智乐辅导班工作到晚上八点，回家后仍看书三小时。她用乐高立方体给陈小龙讲乘除法，代替照本宣科讲错题。</li><li>丹麦蓝罐曲奇铁盒里藏着成绩单、合照、<strong>建模一等奖证书</strong>、心愿单和当年的藏宝图。（KG 未单独记录颁奖那场戏，只记录了证书在铁盒里。）</li><li>老林拒绝担任节目嘉宾——他更爱看女儿吹嘘他是好爸爸的片段，自认记不清事，不能上电视误导孩子。</li><li>永川惠和养老院特大杀人案，死亡 38 人，逃犯枪杀一家三口与民警后持枪逃窜，反侦察能力极强。叶延教授找到林朝夕的导师，导师带学生进驻做追捕模型，手机被收缴，她<strong>失联约 12 小时</strong>。</li><li>裴之在自莫斯科飞永川的航班上，看到「警察为什么会来找我们做模型」的留言，联系花卷打听，四小时后获警方确认。他落地后被例行调查，据路况新闻推断嫌犯被有目的导向周瑞制药，圈出三条重点路径，助警方完成抓捕。第十二小时房门打开，林朝夕红肿着眼扑进他怀里。</li><li>《超级智多星》密码主题录制，红蓝两队各自设计密码。林朝夕用斯巴达筒讲老林的藏宝图游戏，密文解出四个字：<strong>「裴之林朝夕」</strong>。</li></ul>\n<hr>\n<h2 id=\"7-这本书在讲什么用本项目的数据说\">7. 这本书在讲什么（用本项目的数据说）</h2>\n<p>不空谈，只列 KG 实测值：</p>\n<div class='table-wrap'><table class='data'><thead><tr><th>指标</th><th>实测值</th><th>说明</th></tr></thead><tbody><tr><td>师徒关系</td><td><strong>123 条</strong></td><td>全书第一大类关系，远超其他关系 113、亲属 83、救助 58、爱慕 41</td></tr><tr><td>「林朝夕、老林 · 日常生存」</td><td><strong>74 个章号</strong></td><td>全书最高；父女吃饭、擦伤、锁门、倒垃圾，比重演任何名场面的次数都多</td></tr><tr><td>「张老师、林朝夕 · 冲突对峙」</td><td>16 章</td><td>心算王骗局的重演次数</td></tr><tr><td>「林朝夕、许老师 · 成长学习」/「冲突对峙」</td><td>各 15 章</td><td>同一批人反复处理同一类事</td></tr><tr><td>人物语录精选</td><td><strong>25 条</strong>（5 位说话人）</td><td>《废土扫垃圾》是 171 条/46 人。<strong>这是结论不是 bug</strong>——本书不以格言对白见长，名句在叙述层</td></tr><tr><td>对白重复率</td><td>43.1%</td><td>平行世界结构性重播，回响信号已关闭</td></tr></tbody></table></div>\n<p>一句话：它讲的不是天才，是<strong>一个普通人愿意为了父亲重新变成一个学生</strong>。</p>\n<hr>\n<h2 id=\"8-口径与来源\">8. 口径与来源</h2>\n<div class='table-wrap'><table class='data'><thead><tr><th>项</th><th>值</th></tr></thead><tbody><tr><td>源文本</td><td>《天才基本法》长洱 · 221 章 · 69.5 万字</td></tr><tr><td>事件总数</td><td>833 条，100% 带原文摘要</td></tr><tr><td>本文取材</td><td>仅上表事件，未新增情节；每条可回原文核对</td></tr><tr><td>章号</td><td>用正文标题章号（<code>chapters.json</code> 的 <code>no</code>），非抽取器索引</td></tr><tr><td>已知偏差</td><td>① 源文本防盗章导致索引 112 之后偏移 3；② 15 个章号没有以它为首章的事件（事件被并入相邻章）：第<a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"31\">31</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"46\">46</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"77\">77</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"82\">82</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"91\">91</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"95\">95</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"98\">98</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"100\">100</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"124\">124</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"125\">125</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"138\">138</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"147\">147</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"169\">169</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"199\">199</a><a class=\"ch-ref\" href=\"javascript:void(0)\" data-no=\"212\">212</a>章——但 1–221 章<strong>每一章都有事件覆盖，无空章</strong>；③ 「草莓/芝士」两个平行世界名在抽取结果中混用，本文统一称「芝士世界」，素材写「草莓」处保留原说法</td></tr><tr><td>自检</td><td>本文初稿有 21 处章号错挂，已按 <code>data.json</code> 逐条回算修正；修正后全部引用章号均存在于 <code>chapters.json</code>，且每条引用的章号集合与对应事件的 <code>chapters</code> 字段一致</td></tr><tr><td>未收录</td><td>老林车祸本身、建模大赛颁奖现场、晋杯省团体赛决赛过程——KG 无对应事件条目，本文不代答</td></tr></tbody></table></div>\n<hr>\n<p><em>本文由 <code>src/story_material.py</code> 产出的素材包与逐章事件核查后写成。素材包：<code>docs/_material_tiancai.md</code>。</em></p>","toc":[{"lv":1,"t":"《天才基本法》：一篇文章讲完全部故事","id":"天才基本法一篇文章讲完全部故事"},{"lv":2,"t":"0. 先说结构：这本书不能按章号顺着讲","id":"0-先说结构这本书不能按章号顺着讲"},{"lv":2,"t":"1. 一句话版本","id":"1-一句话版本"},{"lv":2,"t":"2. 现实线：22 岁的崩塌","id":"2-现实线22-岁的崩塌"},{"lv":2,"t":"3. 芝士世界：12 岁的开局","id":"3-芝士世界12-岁的开局"},{"lv":3,"t":"3.1 不被送走","id":"31-不被送走"},{"lv":3,"t":"3.2 找到老林","id":"32-找到老林"},{"lv":3,"t":"3.3 心算王骗局（讲一次）","id":"33-心算王骗局讲一次"},{"lv":3,"t":"3.4 学校里的两场仗","id":"34-学校里的两场仗"},{"lv":3,"t":"3.5 选拔考","id":"35-选拔考"},{"lv":2,"t":"4. 夏令营：巴什博弈与规则漏洞","id":"4-夏令营巴什博弈与规则漏洞"},{"lv":2,"t":"5. 老林是谁","id":"5-老林是谁"},{"lv":2,"t":"6. 结局","id":"6-结局"},{"lv":2,"t":"7. 这本书在讲什么（用本项目的数据说）","id":"7-这本书在讲什么用本项目的数据说"},{"lv":2,"t":"8. 口径与来源","id":"8-口径与来源"}],"src":"docs/story_tiancai.md","md_chars":6939,"ref_count":142},"perspectives":{"html":"<h1 id=\"天才基本法-多学科视角分析KG-实证--明察式\">《天才基本法》· 多学科视角分析（KG 实证 · 明察式）</h1>\n<blockquote><p><strong>明察式纪律</strong>：结论先行；每条结论标 <strong>可信度</strong>（高 / 中 / 低）与 <strong>性质</strong>（实测 / 推断）； <strong>推断不得冒充事实</strong>；证据一律带 分子·分母 可回 <code>data/tiancai/data.json</code> 复算； <strong>来源</strong> 指向具体字段（<code>relations[].rel_base</code> / <code>events[].type_base</code> 等）。 时间口径：事件 <code>year</code> 字段 833/833 为空，用书中章号 no 与阶段轴。人物 140 / 事件 833 / 关系 482 / 地点 256。</p></blockquote>\n<hr>\n<h2 id=\"可信度图例\">可信度图例</h2>\n<ul><li><strong>高</strong>：直接由 KG 计数得出，分母明确，零推断（如「师徒 123 条 占 25.5%」）。</li><li><strong>中</strong>：数据实测，但结论是一步归纳（分布 / 占比的读法，如「龙套占 50.7% → 网络长尾」）。</li><li><strong>低（解读）</strong>：文学 / 结构解读，明确标「推断」，反向证据可推翻，不当事实。</li><li><strong>性质 实测</strong>：直接计数 / 字段值。</li><li><strong>性质 推断</strong>：由实测推得的解释性结论，已给边界条件。</li><li><strong>阶段引用</strong>：正文中的「阶段名（起–止）」可点，点击跳到阶段轴并高亮对应阶段段；</li></ul>\n<p>同名多段（如「芝士世界（高中线）」共 8 段）的合计数字不设链接，避免错挂。</p>\n<hr>\n<h2 id=\"1-社会学师徒制而非科层\">1 社会学：师徒制，而非科层</h2>\n<h3 id=\"11-权力结构以知识传承师徒为核心\">1.1 权力结构以知识传承（师徒）为核心</h3>\n<ul><li><strong>结论</strong>：天才基本法的第一大类关系是师徒（123 条，占关系总数 25.5%），科层支配几乎不存在。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：关系总计 482 条边；师徒 123（25.5%）、亲属 83（17.2%）、救助 58（12.0%）、爱慕 41（8.5%）；<strong>支配 0 条、上下级仅 3 条（0.6%）</strong>，即支配+上下级合计 3 条（0.6%）。</li><li><strong>来源</strong>：<code>data/tiancai/data.json</code> · <code>relations[].rel_base</code>（归约后 16 类）</li></ul>\n<h3 id=\"12-这是一部师徒制小说解读\">1.2 这是一部「师徒制」小说（解读）</h3>\n<ul><li><strong>结论</strong>：权力与成长都通过师徒纽带传递，而非组织 / 制度。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：由 1.1 实测分布归纳——师徒 123 条为第一大类（25.5%），且师徒 top 多为代际 / 知识权威绑定（陆志浩→林朝夕×23、林朝夕→裴之×9、林朝夕→陆志浩×8）。<strong>边界</strong>：若师徒占比跌破 ~15% 或支配关系显著上升，本结论弱化。</li><li><strong>来源</strong>：<code>relations[].rel_base</code> + 关系对端点统计</li></ul>\n<h3 id=\"13-人物网络高度长尾\">1.3 人物网络高度长尾</h3>\n<ul><li><strong>结论</strong>：龙套（cameo）占 50.7%，核心仅 16 人却掌握绝大多数关系边。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：140 人中 cameo 71（50.7%）、minor 27（19.3%）、major 26（18.6%）、core 16（11.4%）；core 人均关系边 161.9，cameo 仅 1.0。</li><li><strong>来源</strong>：<code>characters[].tier</code></li></ul>\n<h3 id=\"14-关系残差单列不假装归类\">1.4 关系残差单列（不假装归类）</h3>\n<ul><li><strong>结论</strong>：「其他关系」113 条（23.4%）为未归约残差，不参与主结论排行。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：482 条边中 其他关系 113（23.4%），已单列披露，未硬塞进任何关系类别。</li><li><strong>来源</strong>：<code>relations[].rel_base == &quot;其他关系&quot;</code></li></ul>\n<hr>\n<h2 id=\"2-心理学情感记忆是双线穿越的锚\">2 心理学：情感记忆是双线穿越的锚</h2>\n<h3 id=\"21-记忆情感事件稀疏但集中于主角\">2.1 记忆情感事件稀疏但集中于主角</h3>\n<ul><li><strong>结论</strong>：记忆情感事件仅 29 件（占事件 3.5%），且 62.1% 落在主角林朝夕身上。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：事件总计 833 件；记忆情感 29（3.5%）。主角林朝夕参与 18 件（占全部记忆情感事件的 62.1%）。</li><li><strong>来源</strong>：<code>events[].type_base == &quot;记忆情感&quot;</code> + <code>participants</code></li></ul>\n<h3 id=\"22-情感锚在现实线密度高峰是穿越归来的重逢段解读\">2.2 情感锚在现实线，密度高峰是穿越归来的重逢段（解读）</h3>\n<ul><li><strong>结论</strong>：记忆情感是双线共有的情感锚，但密度高峰落在「穿越归来」的现实线（58–72 段），芝士世界承担成长而非回忆。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：29 件按主阶段（first_no 口径：事件所有章的最小 no 落到的阶段）分布见下表——现实线两段合计 8 件 / 21 章 = 0.38 件/章，芝士世界八段合计 7 件 / 107 章 = 0.07 件/章，相差 5.9 倍；单段密度峰值为 现实线（58–72）0.40 件/章，件数峰值由 现实线（58–72）与 第6段（107–141）并列（各 6 件）。<strong>边界</strong>：若记忆情感占比 &gt;10% 则不再是「锚」而是「主线」。</li></ul>\n<div class='table-wrap'><table class='data'><thead><tr><th>阶段</th><th>记忆情感</th><th>密度(件/章)</th></tr></thead><tbody><tr><td>现实线（1–6）</td><td>2</td><td>0.33</td></tr><tr><td>芝士世界（高中线）（7–18）</td><td>1</td><td>0.08</td></tr><tr><td>第2段（32–57）</td><td>5</td><td>0.19</td></tr><tr><td>现实线（58–72）</td><td>6</td><td>0.40</td></tr><tr><td>第5段（73–91）</td><td>3</td><td>0.16</td></tr><tr><td>芝士世界（高中线）（99–106）</td><td>2</td><td>0.25</td></tr><tr><td>第6段（107–141）</td><td>6</td><td>0.17</td></tr><tr><td>芝士世界（高中线）（142–152）</td><td>1</td><td>0.09</td></tr><tr><td>芝士世界（高中线）（177–221）</td><td>3</td><td>0.07</td></tr></tbody></table></div>\n<ul><li><strong>来源</strong>：<code>events[].type_base == &quot;记忆情感&quot;</code> 阶段归属（first_no 口径）</li></ul>\n<hr>\n<h2 id=\"3-经济学智力成长驱动经济系统近乎空白\">3 经济学：智力成长驱动，经济系统近乎空白</h2>\n<h3 id=\"31-没有任务收益循环\">3.1 没有任务—收益循环</h3>\n<ul><li><strong>结论</strong>：全书副本任务仅 1 件（0.1%），经济系统几乎不存在。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：事件 833 件中副本任务 1（0.1%）；成长学习 131（15.7%）是仅次于日常生存（400 件，48.0%）的第二大类型。</li><li><strong>来源</strong>：<code>events[].type_base</code></li></ul>\n<h3 id=\"32-交换的是知识而非物资解读\">3.2 交换的是知识而非物资（解读）</h3>\n<ul><li><strong>结论</strong>：这部小说的「激励」来自自我实现与智力成长，而非收益。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：生产+商业场所 33 处（占 256 处 12.9%），且 33 处<strong>全部</strong>为「商业服务」、生产处理 0 处——多为学校 / 家庭 / 赛场等「智力活动容器」，没有生产资料节点；对照废土副本任务 373 件（14.4%）形成极端反差。<strong>边界</strong>：若生产+商业占比 &gt;25% 则存在实质经济系统。</li><li><strong>来源</strong>：<code>locations[].type_base ∈ {生产处理, 商业服务}</code></li></ul>\n<hr>\n<h2 id=\"4-政治学制度秩序弱冲突来自个体与家庭\">4 政治学：制度秩序弱，冲突来自个体与家庭</h2>\n<h3 id=\"41-制度秩序与科层几乎不共现\">4.1 制度秩序与科层几乎不共现</h3>\n<ul><li><strong>结论</strong>：天才基本法的冲突不根植于制度 / 科层，而来自个体选择、家庭与师徒关系。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：制度秩序事件 23 件（2.8%）；上下级关系仅 3 条；两者章节共现 <strong>0 章</strong>（制度秩序事件出现的章里，没有任何一章同时出现上下级关系）。</li><li><strong>来源</strong>：<code>events[].type_base == &quot;制度秩序&quot;</code> + <code>relations[].rel_base == &quot;上下级&quot;</code></li></ul>\n<h3 id=\"42-一部去制度化的成长叙事解读\">4.2 一部「去制度化」的成长叙事（解读）</h3>\n<ul><li><strong>结论</strong>：与废土（制度秩序×上下级共现 40 章、71.4%）相反，天才是去中心化的个体成长。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：由 4.1 共现 0 章直接推得；对照见废土视角 §4。<strong>边界</strong>：若共现率 &gt;30% 则归为「制度叙事」。</li><li><strong>来源</strong>：跨书对照（KG_SPEC ④′）</li></ul>\n<hr>\n<h2 id=\"5-叙事学双线分化在体量与类型不在密度\">5 叙事学：双线分化在体量与类型，不在密度</h2>\n<h3 id=\"51-芝士世界是主舞台靠体量与类型构成不靠节奏快慢\">5.1 芝士世界是主舞台——靠体量与类型构成，不靠节奏快慢</h3>\n<ul><li><strong>结论</strong>：两条时间线的<strong>事件密度几乎相同</strong>（都在 2.00–5.17 件/章区间），真正的分化在体量与类型构成——芝士世界占全书一半事件，成长学习与冲突战斗都集中在那里。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：芝士世界（高中线）八段合计 107 章 421 件（占 833 件的 50.5%），现实线两段合计 21 章 85 件（10.2%）；密度区间 芝士世界 2.00–5.17（峰值 芝士世界（高中线）（171–176）5.17）vs 现实线两段 4.00 / 4.07。成长学习 131 件中 62 件在芝士世界；冲突+战斗 93 件（11.2%）中 55 件在芝士世界（59.1%），现实线仅 4 件。逐阶段明细（章数为落在区间内的实数章）：</li></ul>\n<div class='table-wrap'><table class='data'><thead><tr><th>阶段</th><th>章数</th><th>事件</th><th>密度(件/章)</th><th>成长学习</th><th>冲突+战斗</th></tr></thead><tbody><tr><td>现实线（1–6）</td><td>6</td><td>24</td><td>4.00</td><td>4</td><td>1</td></tr><tr><td>芝士世界（高中线）（7–18）</td><td>12</td><td>59</td><td>4.92</td><td>11</td><td>5</td></tr><tr><td>第2段（19–31）</td><td>13</td><td>44</td><td>3.38</td><td>12</td><td>7</td></tr><tr><td>第2段（32–57）</td><td>26</td><td>91</td><td>3.50</td><td>17</td><td>9</td></tr><tr><td>现实线（58–72）</td><td>15</td><td>61</td><td>4.07</td><td>7</td><td>3</td></tr><tr><td>第5段（73–91）</td><td>19</td><td>58</td><td>3.05</td><td>10</td><td>5</td></tr><tr><td>芝士世界（高中线）（92–98）</td><td>7</td><td>23</td><td>3.29</td><td>0</td><td>2</td></tr><tr><td>芝士世界（高中线）（99–106）</td><td>8</td><td>28</td><td>3.50</td><td>1</td><td>4</td></tr><tr><td>第6段（107–141）</td><td>35</td><td>134</td><td>3.83</td><td>19</td><td>13</td></tr><tr><td>芝士世界（高中线）（142–152）</td><td>11</td><td>36</td><td>3.27</td><td>4</td><td>5</td></tr><tr><td>芝士世界（高中线）（153–165）</td><td>13</td><td>49</td><td>3.77</td><td>14</td><td>6</td></tr><tr><td>芝士世界（高中线）（166–170）</td><td>5</td><td>10</td><td>2.00</td><td>3</td><td>1</td></tr><tr><td>芝士世界（高中线）（171–176）</td><td>6</td><td>31</td><td>5.17</td><td>4</td><td>11</td></tr><tr><td>芝士世界（高中线）（177–221）</td><td>45</td><td>185</td><td>4.11</td><td>25</td><td>21</td></tr></tbody></table></div>\n<ul><li><strong>来源</strong>：<code>events[]</code> 阶段归属（first_no 口径）逐阶段计数</li></ul>\n<h3 id=\"52-张力来自穿越重读高中解读\">5.2 张力来自「穿越重读高中」（解读）</h3>\n<ul><li><strong>结论</strong>：作者用平行世界重读高中承载成长动作，现实线承载情感与代价——分工由类型构成决定，而非节奏快慢。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：由 5.1 推得——成长学习 62/131 集中在芝士世界，记忆情感 8/29 集中在现实线（密度 0.38 vs 0.07 件/章）。<strong>边界</strong>：若现实线事件体量达到芝士世界的一半（&gt;210 件，当前 85 件）则为双主线而非缓冲。</li><li><strong>来源</strong>：<code>events[].type_base ∈ {成长学习, 记忆情感}</code> 阶段分布</li></ul>\n<hr>\n<h2 id=\"6-教育学成长学习即主题本身\">6 教育学：成长学习即主题本身</h2>\n<h3 id=\"61-一个关于如何学为何学的教育小说\">6.1 一个关于「如何学、为何学」的教育小说</h3>\n<ul><li><strong>结论</strong>：成长学习事件 131 件（15.7%）是贯穿双线的核心动作，主题即「习得」；分布呈「现实起步 → 芝士世界主修 → 现实收官」。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：事件 833 件中成长学习 131（15.7%），是仅次于日常生存（400 件，48.0%）的第二大类型；按同名阶段合计：芝士世界（高中线）62（八段合计）、第2段 29（两段合计 12+17）、第6段 19、现实线 11（两段合计 4+7）、第5段 10。同名合计不设阶段链接（一段链无法代表多段）；逐段数字见 §5.1 表。</li><li><strong>来源</strong>：<code>events[].type_base == &quot;成长学习&quot;</code></li></ul>\n<h3 id=\"62-与废土互补一个学一个活解读\">6.2 与废土互补：一个学、一个活（解读）</h3>\n<ul><li><strong>结论</strong>：天才的「习得」主题在废土里被「生存」彻底取代（废土成长学习仅 7 件，0.3%）。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据 / 边界</strong>：跨书对照——天才 131（15.7%）vs 废土 7（0.3%），相差约 19 倍。<strong>边界</strong>：若废土成长学习 &gt;30 件则两书主题不再互补。</li><li><strong>来源</strong>：跨书对照（KG_SPEC ④′）</li></ul>\n<hr>\n<hr>\n<h2 id=\"7-地理学一个高度复用的学校福利院办公室三角\">7 地理学：一个高度复用的「学校—福利院—办公室」三角</h2>\n<h3 id=\"71-场景类型近一半是据点--教育科研\">7.1 场景类型近一半是「据点 + 教育科研」</h3>\n<ul><li><strong>结论</strong>：256 处地点中，据点驻地 69（27.0%）与教育科研 54（21.1%）合计 <strong>123 处（48.0%）</strong>，居住空间仅 28（10.9%）。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>locations[].type_base</code> 计数，分母 256。</li><li><strong>来源</strong>：<code>locations[].type_base</code></li><li><strong>边界</strong>：9 个基类由 456 种原文描述归约而来（见 §1 口径），「院长办公室」这类既是据点又属教育科研的地点会被归到其中一类，占比对具体类目敏感、对合计不敏感。</li></ul>\n<h3 id=\"72-场景复用极高一个办公室装了-74-的事件\">7.2 场景复用极高：一个办公室装了 7.4% 的事件</h3>\n<ul><li><strong>结论</strong>：院长办公室承载 <strong>62 件事件（7.4%）</strong>，公园 47（5.6%），top10 地点合计 <strong>278 件（33.4%）</strong>。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：823 件事件有地点、10 件无地点；<code>events[].location</code> 与 <code>locations[].name</code> <strong>精确匹配</strong>。</li><li><strong>来源</strong>：<code>events[].location</code></li><li><strong>边界</strong>：只做精确匹配，别称（「院长办」「院长室」）不计入——真实集中度只高不低。</li></ul>\n<h3 id=\"73-反复出现的空间是记忆锚点解读\">7.3 反复出现的空间是「记忆锚点」（解读）</h3>\n<ul><li><strong>结论</strong>：院长办公室与公园各横跨 <strong>10 个阶段</strong>，红星小学、红星福利院各 8 个——同一空间在现实线与芝士世界被反复重访，承担结构性对照功能。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据</strong>：§7.3 表（地点 → 出现过的阶段数）。</li><li><strong>边界</strong>：跨阶段数只数「出现过」，不含频次；某地点若每段只出现 1 次，其结构权重会被高估。</li><li><strong>来源</strong>：<code>events[].location</code> × 阶段轴（first_no 口径）</li></ul>\n<blockquote><p>坐标状态：256 处<strong>全部未标注</strong>真实坐标，报告内地图为示意——空间结论只谈「场景关系」，不谈现实地理。</p></blockquote>\n<hr>\n<h2 id=\"8-网络科学单星拓扑\">8 网络科学：单星拓扑</h2>\n<h3 id=\"81-先说数据事实482-条边只对应-80-个唯一对\">8.1 先说数据事实：482 条边只对应 80 个唯一对</h3>\n<ul><li><strong>结论</strong>：关系表 482 条边去重后仅 <strong>80 个无向对</strong>，平均每对 <strong>6.03 条</strong>；党爱萍 59 条原始边只连到 3 个邻居（其中一对重复 50 次）。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>relations[]</code> 的 <code>from</code>/<code>to</code> 去重（无向）。</li><li><strong>来源</strong>：<code>relations[].from</code> / <code>relations[].to</code></li><li><strong>边界</strong>：重复来自<strong>跨章重复计数</strong>（同一对关系在多个章各记一次），不是「关系更强」。任何按边数排名都会把重复当影响力，所以本节一律用去重口径；原始条数并列给出以便回查。</li></ul>\n<h3 id=\"82-586-的人物没有任何关系边\">8.2 58.6% 的人物没有任何关系边</h3>\n<ul><li><strong>结论</strong>：<strong>82/140 人（58.6%）零关系边</strong>；有边人物仅 59，平均度 <strong>2.71</strong>；<strong>1 个连通分量</strong>，最大分量 59 节点（占有边人物 100%、占全部人物 42.1%）。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：同上，去重后建图。</li><li><strong>边界</strong>：孤立点大多是龙套（只出场 1 章），这是<strong>抽取值域</strong>问题，不能读作「书中人物孤僻」。</li></ul>\n<h3 id=\"83-林朝夕是唯一的中心\">8.3 林朝夕是唯一的中心</h3>\n<ul><li><strong>结论</strong>：度中心性 林朝夕 <strong>29</strong>（原始 342）、裴之与老林各 15、其余 ≤9；<strong>度=1 的节点 40 个（占有边节点 67.8%）</strong>。分层平均度：core 6.88 / major 0.69，约 <strong>10 倍</strong>。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据</strong>：§8.1 表；tier × 平均度表。</li><li><strong>边界</strong>：若把事件参与边并入网络（§1.3 的混合口径），中心度会被摊薄——本节只算关系边。</li><li><strong>来源</strong>：<code>relations[]</code> 去重 + <code>characters[].tier</code></li></ul>\n<hr>\n<h2 id=\"9-语言学校园语域与低标注对白\">9 语言学：校园语域与低标注对白</h2>\n<h3 id=\"91-称谓随关系位置漂移\">9.1 称谓随关系位置漂移</h3>\n<ul><li><strong>结论</strong>：别名 <strong>166 个 / 140 人（人均 1.19）</strong>，<strong>56 人（40.0%）</strong>至少一个别名；老林 21 个（亲爹、公园看门老大爷、叔叔…），林朝夕 13 个（夕哥、学姐、小丫头…）。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>characters[].aliases</code> 长度统计。</li><li><strong>读法（推断）</strong>：别名不是同义词，而是<strong>关系位置</strong>的标记——同一个人在不同人眼里是「亲爹 / 门卫 / 叔叔」。</li><li><strong>来源</strong>：<code>characters[].aliases</code></li></ul>\n<h3 id=\"92-称谓词表同学-12叔-9老师-8哥-6\">9.2 称谓词表：同学 12、叔 9、老师 8、哥 6</h3>\n<ul><li><strong>结论</strong>：别名中命中最多的称谓是「同学」12 次、「叔」9 次、「老师」8 次、「哥」6 次。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测（词表命中，非分词）</p></blockquote>\n<ul><li><strong>边界</strong>：词表只收 13 个常用称谓，个别别名可能被同名用字误伤，误差不能完全排除。</li><li><strong>读法（推断，中）</strong>：校园语域主导，与废土的「姐 19 / 老板 14 / 队长 10」形成对照——一个是学校，一个是组织。</li></ul>\n<h3 id=\"93-只有-400-的入选对白能归属到说话人\">9.3 只有 40.0% 的入选对白能归属到说话人</h3>\n<ul><li><strong>结论</strong>：入选对白 25 条中 <strong>10 条（40.0%）</strong>能归属到说话人，涉及 <strong>5 位</strong>说话人；对照废土 156/171（91.2%）、46 位。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>quotes.json.meta.attributed / picked</code>。</li><li><strong>解释（推断，中）</strong>：天才的对白多写成独立成段的引号，缺少「XX 说」标签；废土对话更常带说话人标签。<strong>这是文本写法差异，不是抽取失败</strong>——候选句数本身也差 7 倍（1427 vs 10172）。</li><li><strong>边界</strong>：候选句数受篇幅影响（69.5 万字 vs 203.3 万字），跨书比较只看<strong>归属率</strong>，不看绝对条数。</li><li><strong>来源</strong>：<code>quotes.json.meta</code></li></ul>\n<hr>\n<h2 id=\"10-传播学信息靠教不靠探\">10 传播学：信息靠「教」，不靠「探」</h2>\n<h3 id=\"101-信息类事件只占-44\">10.1 信息类事件只占 4.4%</h3>\n<ul><li><strong>结论</strong>：情报对话 <strong>27 件（3.2%）</strong>、密谋博弈 <strong>10 件（1.2%）</strong>，合计 <strong>37 件（4.4%）</strong>；探索发现 27 件（3.2%）。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>events[].type_base</code> 计数，分母 833。</li><li><strong>读法（推断，中）</strong>：天才的信息流动主要发生在教室与考试（成长学习 131 件，15.7%），而不是情报交换——<strong>知识是被教的，不是被探的</strong>。</li><li><strong>边界</strong>：若类型归约把「讲题」判成成长学习而非情报对话，本节会系统性低估信息传递；这是口径问题，已如实标出。</li><li><strong>来源</strong>：<code>events[].type_base</code></li></ul>\n<h3 id=\"102-信息事件是小圈对话\">10.2 信息事件是小圈对话</h3>\n<ul><li><strong>结论</strong>：平均参与者 情报对话 <strong>2.22 人</strong>、密谋博弈 <strong>3.30 人</strong>、日常生存 <strong>2.19 人</strong>。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>边界</strong>：参与者字段含群体称谓，小样本（27 / 10 件）均值易被个别事件拉动。</li><li><strong>来源</strong>：<code>events[].participants</code></li></ul>\n<hr>\n<h2 id=\"11-法学秩序冲突都在规则之内\">11 法学·秩序：冲突都在规则之内</h2>\n<h3 id=\"111-零战斗93-件冲突有裁判的竞争\">11.1 零战斗、93 件冲突：有裁判的竞争</h3>\n<ul><li><strong>结论</strong>：制度秩序 <strong>23 件（2.8%）</strong>、冲突对峙 <strong>93 件（11.2%）</strong>、<strong>战斗 0 件（0.0%）</strong>；敌对关系 21 条（4.4%）；秩序事件/暴力事件 = <strong>0.25</strong>。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>events[].type_base</code> 三类计数。</li><li><strong>读法（推断，中）</strong>：天才的冲突是考试排名、举报、竞赛名额——<strong>有裁判的竞争</strong>。战斗为 0 是硬证据。</li><li><strong>边界</strong>：战斗为 0 也可能来自归约词表未覆盖该书语域；但 93 件冲突事件里未见武器/伤亡描述，倾向判为真实而非漏标。</li><li><strong>来源</strong>：<code>events[].type_base</code> / <code>relations[].rel_base</code></li></ul>\n<h3 id=\"112-秩序事件集中在芝士世界高中线\">11.2 秩序事件集中在芝士世界（高中线）</h3>\n<ul><li><strong>结论</strong>：制度秩序事件最多的阶段是「芝士世界（高中线）（177–221）」7 件，其次「第5段（73–91）」4 件。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>边界</strong>：23 件制度秩序事件分摊到 8 段，单段样本极小，只能看「集中在校园段落」这一层。</li><li><strong>来源</strong>：<code>events[].type_base == &quot;制度秩序&quot;</code> 的阶段分布</li></ul>\n<hr>\n<h2 id=\"12-伦理学救助集中在一个人身上\">12 伦理学：救助集中在一个人身上</h2>\n<h3 id=\"121-58-条救助只对应-8-个有向对\">12.1 58 条救助只对应 8 个有向对</h3>\n<ul><li><strong>结论</strong>：救助关系 <strong>58 条（12.0%）</strong>，去重后仅 <strong>8 个有向对</strong>（平均每对 7.2 条），其中双向 1 对、单向 6 对；<strong>党爱萍一人 50 条</strong>。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>relations[].rel_base == &quot;救助&quot;</code> 去重。</li><li><strong>边界</strong>：58 条<strong>不能</strong>读作「救助密度高」，实际只有 8 组关系——本节结论必须用去重值。</li><li><strong>来源</strong>：<code>relations[].rel_base</code></li></ul>\n<h3 id=\"122-主角是被保护者\">12.2 主角是被保护者</h3>\n<ul><li><strong>结论</strong>：林朝夕 <strong>施救 1 次、被救 53 次</strong>；危机伤亡事件仅 2 件（0.2%）、撤离救援 0 件。</li></ul>\n<blockquote><p>可信度：中 ｜ 性质：推断</p></blockquote>\n<ul><li><strong>证据</strong>：救助边按方向统计（原始条数口径，因主角一侧的对数本身很少）。</li><li><strong>读法</strong>：她的成长线是「被托举」的——父亲、老师、福利院构成保护网。</li><li><strong>边界</strong>：被救 53 次是原始条数，去重后是「个位数施救者」量级；方向结论成立，频次不宜引用。</li></ul>\n<hr>\n<h2 id=\"13-性别研究数据不足以支撑本节只报缺口\">13 性别研究：数据不足以支撑（本节只报缺口）</h2>\n<ul><li><strong>结论</strong>：可判定 <strong>14/140 人（10.0%）</strong>，女 7 / 男 7；其余 126 人（90.0%）不判。<strong>因此本节不做任何性别结论。</strong></li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测（覆盖率）</p></blockquote>\n<ul><li><strong>证据</strong>：按 role 首分句的性别词（女主角/母亲/妻子/她…）与亲属式（之母/之妻…）判定，男女线索冲突时不判。</li><li><strong>为什么不做结论</strong>：10% 的样本且集中在核心角色，任何「女性平均关系度更高」之类的对比都是<strong>抽样偏差</strong>，不是发现。</li><li><strong>要做得成的前提</strong>：抽取阶段增加 <code>gender</code> 字段，以原文代词/称谓为证据逐条判定；事后从 role 猜不可靠（<code>她/他</code> 在章级描述里常指代他人）。</li><li><strong>来源</strong>：<code>characters[].role</code></li></ul>\n<hr>\n<h2 id=\"14-医学身体疾病是情节装置\">14 医学·身体：疾病是情节装置</h2>\n<h3 id=\"141-科研医疗-60医疗场所只有-2-处\">14.1 科研医疗 6.0%，医疗场所只有 2 处</h3>\n<ul><li><strong>结论</strong>：科研医疗 <strong>50 件（6.0%）</strong>、危机伤亡 2 件（0.2%）、医疗场所仅 <strong>2 处（0.8%）</strong>。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测</p></blockquote>\n<ul><li><strong>证据</strong>：<code>events[].type_base</code> / <code>locations[].type_base</code>。</li><li><strong>读法（推断，低）</strong>：疾病主要发生在家里与叙事里，不在医院场景中——「身体」在此书里是<strong>认知的隐喻</strong>（记忆会流失，数学不会）。</li><li><strong>边界</strong>：医疗场所仅 2 处也可能只是地点抽取的粒度问题（家中的病榻没被登记为医疗场所），不能单凭此推断作者意图。</li></ul>\n<h3 id=\"142-事件名关键词阿尔茨海默-14病-13\">14.2 事件名关键词：阿尔茨海默 14、病 13</h3>\n<ul><li><strong>结论</strong>：事件名命中「阿尔茨海默」14 次、「病」13 次。</li></ul>\n<blockquote><p>可信度：高 ｜ 性质：实测（关键词口径，只数事件名，不读正文）</p></blockquote>\n<ul><li><strong>边界</strong>：只覆盖事件名，正文里的病症描述未计入，实际提及只会更多不会更少。</li><li><strong>来源</strong>：<code>events[].name</code> 关键词匹配</li></ul>\n<hr>\n<h2 id=\"15-口径与缺口声明沿用-KG_SPEC-⑤\">15 口径与缺口声明（沿用 KG_SPEC ⑤）</h2>\n<ul><li>事件 <code>year</code> 字段 833/833 为空，时间一律用章号 no 与阶段轴，不用公元纪年。</li><li><code>participants</code> 含群体称谓（全班 / 各校代表），派生边计数时已按非人物实体排除。</li><li>关系基类仍有「其他」残差 113 条（23.4%），已单列（§1.4），未强行归类、未进主结论排行。</li><li>源文本 57 对重复章节（防盗章伪影），对白 / 事件计数可能重复计入；比例类指标已留意，绝对数仅供参考。</li><li>阶段划分：天才双线按 <code>time</code> 关键词切分 + 兜底等长（18 章/段，过长再切），共 14 段；221 章全部落入阶段区间，无断档。</li><li>阶段表由 <code>src/verify_perspectives.py</code> 独立重算并逐格核对：每个「阶段名（起–止）」必须真实存在、区间不得虚构，§5.1 全表 14 行逐一在文档中出现。</li></ul>\n<hr>\n<p><em>数据来源：<code>data/tiancai/data.json</code>；现算：<code>src/perspectives_prep.py</code>；复核：<code>src/verify_perspectives.py</code>。</em></p>","toc":[{"lv":1,"t":"《天才基本法》· 多学科视角分析（KG 实证 · 明察式）","id":"天才基本法-多学科视角分析KG-实证--明察式"},{"lv":2,"t":"可信度图例","id":"可信度图例"},{"lv":2,"t":"1 社会学：师徒制，而非科层","id":"1-社会学师徒制而非科层"},{"lv":3,"t":"1.1 权力结构以知识传承（师徒）为核心","id":"11-权力结构以知识传承师徒为核心"},{"lv":3,"t":"1.2 这是一部「师徒制」小说（解读）","id":"12-这是一部师徒制小说解读"},{"lv":3,"t":"1.3 人物网络高度长尾","id":"13-人物网络高度长尾"},{"lv":3,"t":"1.4 关系残差单列（不假装归类）","id":"14-关系残差单列不假装归类"},{"lv":2,"t":"2 心理学：情感记忆是双线穿越的锚","id":"2-心理学情感记忆是双线穿越的锚"},{"lv":3,"t":"2.1 记忆情感事件稀疏但集中于主角","id":"21-记忆情感事件稀疏但集中于主角"},{"lv":3,"t":"2.2 情感锚在现实线，密度高峰是穿越归来的重逢段（解读）","id":"22-情感锚在现实线密度高峰是穿越归来的重逢段解读"},{"lv":2,"t":"3 经济学：智力成长驱动，经济系统近乎空白","id":"3-经济学智力成长驱动经济系统近乎空白"},{"lv":3,"t":"3.1 没有任务—收益循环","id":"31-没有任务收益循环"},{"lv":3,"t":"3.2 交换的是知识而非物资（解读）","id":"32-交换的是知识而非物资解读"},{"lv":2,"t":"4 政治学：制度秩序弱，冲突来自个体与家庭","id":"4-政治学制度秩序弱冲突来自个体与家庭"},{"lv":3,"t":"4.1 制度秩序与科层几乎不共现","id":"41-制度秩序与科层几乎不共现"},{"lv":3,"t":"4.2 一部「去制度化」的成长叙事（解读）","id":"42-一部去制度化的成长叙事解读"},{"lv":2,"t":"5 叙事学：双线分化在体量与类型，不在密度","id":"5-叙事学双线分化在体量与类型不在密度"},{"lv":3,"t":"5.1 芝士世界是主舞台——
