{"p":[["林朝夕",1]],"l":[["福利院",1]],"e":[]},"13-性别研究数据不足以支撑本节只报缺口":{"p":[],"l":[],"e":[]},"14-医学身体疾病是情节装置":{"p":[],"l":[],"e":[]},"141-科研医疗-60医疗场所只有-2-处":{"p":[],"l":[],"e":[]},"142-事件名关键词阿尔茨海默-14病-13":{"p":[],"l":[],"e":[]},"15-口径与缺口声明沿用-KG_SPEC-⑤":{"p":[],"l":[],"e":[]}},"linked":{"林朝夕":["p","林朝夕"],"陆志浩":["p","陆志浩"],"裴之":["p","裴之"],"院长办公室":["l","院长办公室"],"红星福利院":["l","红星福利院"],"红星小学":["l","红星小学"],"党爱萍":["p","党爱萍"],"老林":["p","老林"],"公园看门老大爷":["p","老林"],"小丫头":["p","林朝夕"],"夕哥":["p","林朝夕"],"福利院":["l","福利院"],"草莓世界":["l","草莓世界"],"书桌":["l","书桌"],"池塘":["l","池塘"]},"byPerson":{"林朝夕":["12-这是一部师徒制小说解读","21-记忆情感事件稀疏但集中于主角","83-林朝夕是唯一的中心","91-称谓随关系位置漂移","122-主角是被保护者"],"陆志浩":["12-这是一部师徒制小说解读"],"裴之":["12-这是一部师徒制小说解读","83-林朝夕是唯一的中心"],"党爱萍":["81-先说数据事实482-条边只对应-80-个唯一对","121-58-条救助只对应-8-个有向对"],"老林":["83-林朝夕是唯一的中心","91-称谓随关系位置漂移"]},"byPlace":{"院长办公室":["71-场景类型近一半是据点--教育科研","72-场景复用极高一个办公室装了-74-的事件","73-反复出现的空间是记忆锚点解读"],"红星福利院":["73-反复出现的空间是记忆锚点解读"],"红星小学":["73-反复出现的空间是记忆锚点解读"],"福利院":["122-主角是被保护者"]},"byEvent":{},"stats":{"persons":254,"places":243,"events":833,"linked":15,"linked_by_papers":3}}},"papers":{"items":[{"slug":"01-sociology","zh":"关系的两种写法：社交资本、孤立点与被重复计数的边","en":"Two Ways of Writing Relations: Social Capital, Isolates, and Repeated Edges","kzh":"关系社会学；社会资本；弱关系；孤立点；双文本对照","n_ref":3,"chars":3509,"html":"<h1 id=\"关系的两种写法社交资本孤立点与被重复计数的边\">关系的两种写法：社交资本、孤立点与被重复计数的边</h1>\n<p><strong>Two Ways of Writing Relations: Social Capital, Isolates, and Repeated Edges</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>两本长篇小说的关系表分别有 482 条与 1606 条记录，但去重后只剩 80 对与 492 对——同一对人物被跨章重复记录，平均每对 6.03 条与 3.26 条。本文先纠正这个计数事实，再比较两书的关系结构：天才基本法是单星网络（1 个连通分量、58.6% 的人物零关系边），我在废土世界扫垃圾是有组织的多团块（6 个分量、最大分量占 74.7%）。同一套社会资本理论在两种结构里兑现方式完全不同：一个只能通过单一枢纽兑现，一个可以绕过枢纽。</p>\n<p><strong>Abstract:</strong> The two novels yield 482 and 1606 relation records, but only 80 and 492 unique undirected pairs remain after de-duplication. We first correct this counting artefact, then compare relational structure: Tiancai Jibenfa is a single-star network, while Wozai Feitu Shijie Sao Laji is a multi-cluster organisation. Social capital theory cashes out very differently in the two shapes.</p>\n<p><strong>关键词：</strong>关系社会学；社会资本；弱关系；孤立点；双文本对照</p>\n<p><strong>Keywords:</strong> sociology of relations; social capital; weak ties; isolates; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>把小说读成社会，最容易被误读的一个数字是「关系条数」。482 与 1606 这两个数字看起来像社交广度，实际上它们是<strong>跨章重复计数</strong>的产物：同一对人物在第 1 章、第 37 章、第 108 章各被抽取一次，就会产生三条记录。格兰诺维特（Granovetter, 1973）讨论弱关系时，关心的是「谁与谁相连」这个拓扑，而不是「相连被记录了几次」。本文因此先做一件不讨好的事：把重复去掉，再看结构。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>《天才基本法》（长洱，221 章）与《我在废土世界扫垃圾》（有花在野，439 章）。两书经同一套抽取流程构建知识图谱：章节切分 → 人物/地点/事件/关系结构化 → 类型归约 → 校验。规模为人物 140 / 379，事件 833 / 2591，关系 482 / 1606，地点 256 / 1037。</p>\n<h3 id=\"22-去重口径\">2.2 去重口径</h3>\n<p>关系表按「无向对」去重：<code>(A,B)</code> 与 <code>(B,A)</code> 视为同一对，只保留一次。所有拓扑量（度、平均度、连通分量、孤立点）一律用去重口径；原始条数并列给出以便回查。这一步不是修饰，而是<strong>结论方向会被它改写</strong>：按原始条数排名，党爱萍会以 59 条边进入核心圈；按去重口径，她只有 3 个邻居。</p>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>孤立点大多是只出场一章的龙套，这属于<strong>抽取值域</strong>问题，不能读作「书中人物孤僻」。本文只对「有边人物」的内部结构下结论。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-关系表的条数不是社交广度\">3.1 关系表的条数不是社交广度</h3>\n<p><strong>结论</strong>：天才 482 条关系只覆盖 80 个唯一对（平均每对 6.03 条）；废土 1606 条覆盖 492 对（3.26 条/对）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].from/to</code> 无向去重，分母 482 / 1606 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>两书的重复强度差了近一倍。天才的重复来自「平行世界重演」——草莓世界与芝士世界的同一场景被各记一次，因此同一对关系反复出现；废土的重复更接近「长期同行」——队友关系在数百章里持续存在，每章各记一次。<strong>同一个计数现象，背后是两种叙事机制</strong>（此句为推断，可信度中）。</p>\n<h3 id=\"32-一个星与六个团块\">3.2 一个星，与六个团块</h3>\n<p><strong>结论</strong>：天才的关系图是 1 个连通分量、最大分量 59 人（42.1%），中心是林朝夕（度 29），度=1 的节点占 67.8%；废土是 6 个分量、最大分量 283 人（74.7%），中心是祝宁（度 126），度=1 占 51.9%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：去重后建图，节点 59 / 293，平均度 2.71 / 3.36 ｜ 来源：<code>relations[]</code> + <code>characters[]</code></p></blockquote>\n<p>天才有 82 人（58.6%）完全没有关系边，废土 119 人（31.4%）。这组差距比中心度更能说明体裁差异：校园叙事把绝大多数人写成「同班同学」这种<strong>无差别背景</strong>，组织叙事则必须给每个人一个位置（队友、上下级、交易对象）。废土的关系基类里出现了天才完全没有的三类：交易 40、支配 48、寄生 8。</p>\n<h3 id=\"33-别名是关系位置的标记不是同义词\">3.3 别名是关系位置的标记，不是同义词</h3>\n<p><strong>结论</strong>：天才 166 个别名覆盖 40% 的人物；废土 479 个覆盖 53%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>characters[].aliases</code> 长度统计 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>一个人被叫「老林」「林爸爸」「公园看门老大爷」，不是三个名字，是三个<strong>关系位置</strong>。林（Lin, 2001）把这种可动员的关系称为社会资本：它的价值不在名单长度，而在「谁能以什么名义调用谁」。天才的别名密度低于废土，但别名的<strong>跨度</strong>更大（从亲属称谓到职业称谓），这与单星结构一致——所有关系都要经过同一个枢纽，于是枢纽必须拥有多种身份。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>斯科特（Scott, 2017）区分公开文本与隐藏文本：弱者在大人物面前表演顺从，在背后另有一套话语。这套框架在废土比在天才更适用——废土有 267 条上下级关系与 48 条支配关系，等级是明写的；天才的等级是分数排名，明写但可推翻。<strong>当等级可以被考试推翻时，隐藏文本的需求就下降了</strong>，这或许是天才的「冲突」多为公开竞争的原因。</p>\n<p>本研究的边界很清楚：图谱记录的是「书里写了谁与谁有关」，不是「人物在虚构世界里真实的社会网」。抽取偏向有名字、有台词、有互动的人，沉默者会被系统性漏掉。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>两本书的关系结构不能用一个「关系条数」概括。去掉重复计数之后，一个是围绕单一枢纽的星形网络，一个是多团块的组织网络；同样叫「社会资本」，前者只能通过枢纽兑现，后者可以绕过枢纽自组织。<strong>计数口径的纠正不是技术细节，它决定了我们看见的是一个人，还是一个社会。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Granovetter, M. S. (1973). The Strength of Weak Ties. <em>American Journal of Sociology</em>, <em>78</em>(6), 1360–1380. https://doi.org/10.1086/225469</li><li>Lin, N. (2001). <em>Social Capital</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511815447</li><li>Scott, J. C. (2017). <em>Domination and the Arts of Resistance</em>. Yale University Press. https://doi.org/10.12987/9780300153569</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"02-psychology","zh":"动机的两种来源：掌握体验与生存压力","en":"Two Sources of Motivation: Mastery Experience and Survival Pressure","kzh":"自我决定理论；自我效能；能力信念；动机；双文本对照","n_ref":3,"chars":3574,"html":"<h1 id=\"动机的两种来源掌握体验与生存压力\">动机的两种来源：掌握体验与生存压力</h1>\n<p><strong>Two Sources of Motivation: Mastery Experience and Survival Pressure</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法里「成长学习」占事件的 15.7%，我在废土世界扫垃圾只有 0.3%——但这不是「谁更爱学习」，而是两种动机被叙述成了不同的事件类型。本文用自我决定理论、自我效能与能力信念三条线索拆解这个差距：天才的动机来自掌握体验（可重复的失败与修正），废土的动机来自生存压力（不可协商的伤亡，4.9% 对 0.2%）。两者都成立，但它们不是同一种心理机制。</p>\n<p><strong>Abstract:</strong> Learning events account for 15.7% of events in Tiancai Jibenfa but only 0.3% in the wasteland novel. This is not a difference in diligence but in how motivation is narrated. Using self-determination theory, self-efficacy, and implicit theories of ability, we show that the former rests on mastery experience while the latter rests on survival pressure.</p>\n<p><strong>关键词：</strong>自我决定理论；自我效能；能力信念；动机；双文本对照</p>\n<p><strong>Keywords:</strong> self-determination theory; self-efficacy; implicit theories; motivation; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>一个读者很容易从「成长学习事件占 15.7%」推出「这本书更励志」。这个推论在方法上是错的：事件类型是<strong>归约</strong>的结果，同一件事可以被归成「学习」也可以被归成「战斗」。本文因此不比较绝对密度，而比较<strong>动机被写成什么形状</strong>：失败是否可修正、能力是否可增长、他人的支持是否可预期。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料与规模\">2.1 语料与规模</h3>\n<p>两书分别为 221 章 / 833 事件 / 140 人，与 439 章 / 2591 事件 / 379 人。事件按 15 个叙事功能基类归约（战斗、冲突对峙、成长学习、危机伤亡、情报对话等），归约词表由两书共用。</p>\n<h3 id=\"22-三个可操作指标\">2.2 三个可操作指标</h3>\n<ul><li><strong>掌握体验</strong>：归为「成长学习」的事件数及其占比——对应班杜拉（Bandura, 1977）所说的效能感最主要的来源；</li><li><strong>能力信念</strong>：失败后是否出现「再试一次」结构，用「冲突对峙」与「成长学习」的比值近似；</li><li><strong>关系性支持</strong>：救助关系的去重对数——对应自我决定理论中的 relatedness（Ryan &amp; Deci, 2000）。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>归约词表对「打斗」敏感、对「顿悟」不敏感。废土的修炼与升级大量落在「战斗」「副本任务」里（14% + 14.4%），不会被计入成长学习。因此<strong>跨书的成长学习占比不可直接比较</strong>，只能比较其内部构成。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-成长事件被写成了两种东西\">3.1 成长事件被写成了两种东西</h3>\n<p><strong>结论</strong>：天才「成长学习」131 件（15.7%），废土 7 件（0.3%）；而废土的「战斗」363 件（14%）、「副本任务」373 件（14.4%）在天才几乎为零。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测（占比属归约口径）｜ 证据：<code>events[].type_base</code> 计数，分母 833 / 2591 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>把三类合并看，两书的「能力增长事件」并没有数量级差距；差距在<strong>增长被放在哪一类里</strong>。天才的增长发生在教室与书桌前，可以被命名、被评分、被复述；废土的增长发生在战斗里，只能通过「活下来」被证明。这正是德韦克（Dweck &amp; Leggett, 1988）所说能力信念的分野：前者是<strong>渐进论</strong>（能力可通过努力增长），后者更接近<strong>实体论</strong>的变体——能力是既成的，考验只是筛选。</p>\n<h3 id=\"32-失败的可修复性差-25-倍\">3.2 失败的可修复性差 25 倍</h3>\n<p><strong>结论</strong>：天才「危机伤亡」2 件（0.2%），废土 128 件（4.9%），相差约 25 倍；同期「冲突对峙」天才 11.2%、废土 3.4%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：同 3.1 ｜ 来源：<code>events[].type_base</code></p></blockquote>\n<p>天才的冲突密度反而更高（11.2% 对 3.4%），但几乎不产生伤亡；废土反过来，冲突少而代价重。这组反向数字说明：<strong>冲突的频率与冲突的后果是两件事</strong>。天才的冲突是「考试名次、竞赛名额、举报」，输了可以再来；废土的冲突一旦发生就可能死人。班杜拉意义上的掌握体验需要一个安全失败的环境，而废土从结构上不提供这个环境。</p>\n<h3 id=\"33-支持是可预期还是可遇不可求\">3.3 支持是可预期还是可遇不可求</h3>\n<p><strong>结论</strong>：天才救助关系去重后仅 8 个有向对（其中双向 1 对），废土 52 对（双向 7 对）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].rel_base == &quot;救助&quot;</code> 去重 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>天才的救助高度集中：8 个对里，主角一侧占了绝大多数（详见报告「伦理学」一节）。这意味着支持<strong>可预期但不可选择</strong>——保护来自固定的几个人。废土的救助分散在 52 个对上，支持来自组织，可替换但需要交换。自我决定理论把 relatedness 视为基本需求，但两书给出的满足方式不同：一个是关系性的，一个是制度性的。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>把这三条放在一起，可以看到一个反直觉的结论：<strong>励志感不来自成长事件的数量，而来自失败的可修复性</strong>。天才的成长事件密度高，本质上是因为它允许角色反复失败；废土的成长事件少，是因为它的世界不允许失败被重复。读者感到「燃」的机制，可能正是这种「输了还能再来」的结构性许可。</p>\n<p>研究的边界在于：事件类型由词表归约，词表本身带有体裁偏向。若要更严格地比较动机，需要逐事件标注「是否有再次尝试」这一行为特征，而不是依赖类型标签。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>两本书写的是两种动机：一种建立在掌握体验上，失败可重复、能力可增长；一种建立在生存压力上，能力是既成的、考验只做筛选。把它们放在同一个「励志」标尺上比较是不成立的；但拆开看，两者的心理机制都清晰可辨——<strong>一个写的是如何变强，一个写的是如何不死</strong>。</p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Bandura, A. (1977). Self-efficacy: Toward a unifying theory of behavioral change. <em>Psychological Review</em>, <em>84</em>(2), 191–215. https://doi.org/10.1037/0033-295x.84.2.191</li><li>Dweck, C. S., &amp; Leggett, E. L. (1988). A social-cognitive approach to motivation and personality. <em>Psychological Review</em>, <em>95</em>(2), 256–273. https://doi.org/10.1037/0033-295x.95.2.256</li><li>Ryan, R. M., &amp; Deci, E. L. (2000). Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being. <em>American Psychologist</em>, <em>55</em>(1), 68–78. https://doi.org/10.1037/0003-066x.55.1.68</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"03-economics","zh":"人力资本与配给制：两种资源配置的叙事","en":"Human Capital and Rationing: Two Narratives of Resource Allocation","kzh":"人力资本；公共池塘资源；交易关系；教育投入；双文本对照","n_ref":2,"chars":3192,"html":"<h1 id=\"人力资本与配给制两种资源配置的叙事\">人力资本与配给制：两种资源配置的叙事</h1>\n<p><strong>Human Capital and Rationing: Two Narratives of Resource Allocation</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法把资源问题写成「投资」：教育科研场所占 21.1%，科研医疗事件占 6%，回报延迟但可预期。我在废土世界扫垃圾把资源问题写成「配给」：交易关系 40 条、支配关系 48 条、撤离救援 31 件，而天才这两类关系各为 0。本文用人力资本与公共池塘资源两套框架说明：同一个「稀缺」在不同叙事里被制度化了两次，一次通过考试，一次通过配给。</p>\n<p><strong>Abstract:</strong> Tiancai Jibenfa narrates scarcity as investment (21.1% of locations are educational), while the wasteland novel narrates it as rationing (40 exchange and 48 domination relations, against zero in the former). We read the two regimes through human capital theory and commons governance.</p>\n<p><strong>关键词：</strong>人力资本；公共池塘资源；交易关系；教育投入；双文本对照</p>\n<p><strong>Keywords:</strong> human capital; commons; exchange relations; educational investment; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>经济学在文学研究里常被当作隐喻使用。贝克尔（Becker, 1962）把教育支出视为一种投资，其回报延迟但可计算；这个框架恰好能解释一本书的选择，却解释不了另一本。两本书提供了可以直接计数的东西：谁在什么地方、以什么名义、把资源给谁。教育场所的比例、交易关系的条数、救援事件的分布，都是<strong>配置机制的痕迹</strong>。本文不问「哪本书更批判现实」，只问：稀缺在两书中被哪种制度处理。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>《天才基本法》221 章 / 833 事件 / 256 地点；《我在废土世界扫垃圾》439 章 / 2591 事件 / 1037 地点。地点按 9–13 个功能基类归约（据点驻地、教育科研、商业服务、医疗场所、管制边界等）。</p>\n<h3 id=\"22-三个指标\">2.2 三个指标</h3>\n<ul><li><strong>投入强度</strong>：教育科研与科研医疗类目的占比（对应 Becker, 1962 的人力资本投资）；</li><li><strong>交换形式</strong>：交易 / 支配 / 救助三类关系的条数与去重对数（对应 Ostrom, 1990 的资源配置规则）；</li><li><strong>制度密度</strong>：「制度秩序」事件占比，衡量规则被叙述的频次。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>两书的地点粒度不同（256 对 1037），百分比可比较、绝对数不可比较。关系条数存在跨章重复，本文同时给出去重值。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-天才把稀缺投进教室废土把它摊在路上\">3.1 天才把稀缺投进教室，废土把它摊在路上</h3>\n<p><strong>结论</strong>：教育科研类地点天才 54 处（21.1%），废土 27 处（2.6%）；科研医疗事件 50 件（6%）对 135 件（5.2%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>locations[].type_base</code>、<code>events[].type_base</code> ｜ 来源：<code>locations.json</code> / <code>events.json</code></p></blockquote>\n<p>天才的稀缺是「名额」：好学校、竞赛资格、导师时间，都要通过考试分配，因此叙事必须把空间集中在教室与办公室。废土的稀缺是「物资与安全」，空间摊开在据点、交通通道与遗迹之间（据点驻地 312 处、交通通道 123 处、遗迹尸骸 40 处）。<strong>空间分布是配置机制的直接投影</strong>。</p>\n<h3 id=\"32-一个有交易一个只有赠予\">3.2 一个有交易，一个只有赠予</h3>\n<p><strong>结论</strong>：废土有交易关系 40 条、支配关系 48 条、寄生关系 8 条；天才在这三类上均为 0，其救助关系 58 条（去重后 8 对）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].rel_base</code> 计数与去重 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>这是全书最干净的一组对照。天才的资源配置不通过交换完成，而通过<strong>赠予与保护</strong>：父亲教女儿、老师带学生、福利院收养孤儿。赠予的特征是不可计价，也因此不可积累——你无法用「被教了三次」去换「一次名额」。废土则有明确的可计价关系：交易 40 条意味着存在价格，支配 48 条意味着存在强制，两者共同构成配给制的两端。奥斯特罗姆（Ostrom, 1990）讨论公共池塘资源时强调，规则是否被参与者自己制定，决定了资源能否持续；废土的制度秩序事件 72 件（2.8%）正是这套规则的叙述痕迹。</p>\n<h3 id=\"33-制度密度相同制度内容相反\">3.3 制度密度相同，制度内容相反</h3>\n<p><strong>结论</strong>：两书「制度秩序」占比都是 2.8%（23 件对 72 件），但天才集中在校园段落，废土集中在管制边界与据点。</p>\n<blockquote><p>可信度：中 ｜ 性质：推断（占比为实测，集中度为阶段分布推断）｜ 证据：同 3.1 ｜ 来源：<code>events[].type_base</code> × 阶段轴</p></blockquote>\n<p>占比相同是巧合，含义相反：天才的制度是<strong>评分规则</strong>（谁被允许参加考试），废土的制度是<strong>准入规则</strong>（谁能进哪个据点）。前者可以申诉，后者只能服从。这一条的可信度只到「中」——阶段分布的分母较小，单段样本容易波动。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>把两书并置，会看到人力资本理论的一个隐含前提被抽掉了。贝克尔模型假定投资可以延迟回报：今天读书，明天收益。天才完整地保留了这一前提，甚至把它写成信念（「数学不会骗人」）。废土则把这个前提拆了：如果明天不一定到来，投资就退化为储备，储备再退化为配给。<strong>同一套经济学，在两种时间结构里给出相反的理性</strong>。</p>\n<p>边界在于：本文只统计「被叙述为经济行为」的事件，书中大量隐含的资源流动（家务、照护、情感劳动）没有进入图谱。这部分劳动的缺席本身值得另文讨论。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法用投资叙述稀缺，我在废土世界扫垃圾用配给叙述稀缺。前者的核心制度是考试，后者的核心制度是准入；前者的关系以赠予为主，后者的关系以交易与支配为主。两种叙事都成立，但它们对「未来是否可信」给出了不同答案——而这正是经济学叙事最深的假设。</p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Becker, G. S. (1962). Investment in Human Capital: A Theoretical Analysis. <em>Journal of Political Economy</em>, <em>70</em>(5, Part 2), 9–49. https://doi.org/10.1086/258724</li><li>Ostrom, E. (1990). <em>Governing the Commons</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511807763</li></ul>\n<blockquote><p>文献核验：以上 2 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"04-politics","zh":"裁判、科层与暴力：三种秩序技术","en":"Referee, Hierarchy, and Violence: Three Technologies of Order","kzh":"权力形态；科层；暴力垄断；隐藏文本；双文本对照","n_ref":2,"chars":2919,"html":"<h1 id=\"裁判科层与暴力三种秩序技术\">裁判、科层与暴力：三种秩序技术</h1>\n<p><strong>Referee, Hierarchy, and Violence: Three Technologies of Order</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法的秩序由裁判维持：战斗事件 0 件、冲突 93 件却几乎无伤亡。我在废土世界扫垃圾的秩序由科层与暴力维持：战斗 363 件（14%）、上下级关系 267 条、支配关系 48 条，而天才的上下级关系只有 3 条。本文比较两书的秩序技术：一种把冲突收进规则，一种把规则交给暴力，第三种则是在规则边缘生长的密谋。</p>\n<p><strong>Abstract:</strong> Order in Tiancai Jibenfa is sustained by a referee (zero battles, 93 conflicts with almost no casualties); order in the wasteland novel is sustained by hierarchy and violence (363 battles, 267 superior-subordinate relations). We compare three technologies of order and the forms of resistance each permits.</p>\n<p><strong>关键词：</strong>权力形态；科层；暴力垄断；隐藏文本；双文本对照</p>\n<p><strong>Keywords:</strong> power; hierarchy; monopoly of violence; hidden transcripts; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>政治学的老问题是：秩序从哪里来。两本书给了三个不同答案，而且都能被计数——裁判（考试与排名）、科层（队伍与据点）、暴力（战斗与伤亡）。三者不是互斥的，但配比决定了一本书里「反抗」长什么样。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>两书事件总量 833 与 2591，关系总量 482 与 1606（均含跨章重复，拓扑量另用去重口径）。事件按 15 个功能基类归约，关系按 17 个基类归约。</p>\n<h3 id=\"22-三个指标\">2.2 三个指标</h3>\n<ul><li><strong>暴力</strong>：战斗事件数、危机伤亡事件数；</li><li><strong>科层</strong>：上下级 / 支配 / 队友三类关系条数；</li><li><strong>异议</strong>：密谋博弈与情报对话的事件占比，用斯科特（Scott, 2017）的「隐藏文本」框架读。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>「制度秩序」是归约标签，包含考试规则、据点规章、组织纪律等不同对象。本文用它做<strong>密度</strong>比较，不做<strong>性质</strong>判定；性质判定依赖具体事件，见报告「法学·秩序」一节。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-天才的暴力是零\">3.1 天才的暴力是零</h3>\n<p><strong>结论</strong>：天才战斗事件 0 件（0%）、危机伤亡 2 件（0.2%），而冲突对峙 93 件（11.2%）；废土战斗 363 件（14%）、危机伤亡 128 件（4.9%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> 计数，分母 833 / 2591 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>零战斗是一个强事实：不是「战斗写得少」，而是一件都没有。天才的冲突全部发生在有裁判的场域里——考试、竞赛、评审、举报。裁判的存在使冲突可以高频（11.2%）而不致命（0.2%）。废土则相反：冲突密度低（3.4%），但一旦发生就进入战斗（14%）与伤亡（4.9%）。<strong>暴力垄断者是谁，决定了冲突被记成哪一种事件。</strong></p>\n<h3 id=\"32-权威的形状师生与科层\">3.2 权威的形状：师生与科层</h3>\n<p><strong>结论</strong>：天才师徒关系 123 条、上下级 3 条；废土上下级 267 条、队友 267 条、支配 48 条、师徒 29 条。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].rel_base</code> 计数 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>天才的权威是<strong>知识型</strong>的：老师与学生的关系（123 条）远多于行政上下级（3 条）。这种权威可以被质疑——只要学生的解题更强。废土的权威是<strong>职位型</strong>的：上下级与队友两类合计 267+267 条，构成一张稳定的指挥链。奥斯特罗姆（Ostrom, 1990）指出，自治规则能否持续，取决于成员是否参与制定；废土的指挥链显然不是自治的，而是生存压力下形成的。</p>\n<h3 id=\"33-密谋是弱势者的政治语言\">3.3 密谋是弱势者的政治语言</h3>\n<p><strong>结论</strong>：废土密谋博弈 207 件（8%）、情报对话 235 件（9.1%）；天才分别为 10 件（1.2%）与 27 件（3.2%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>废土的信息类事件占比接近两成，其中密谋占 8%。斯科特（Scott, 2017）把这种「背后说的话」称为隐藏文本：它出现在权力不对等且公开申诉无用的场合。天才的密谋只有 1.2%，因为它的权力不对等可以被考试翻转——<strong>当申诉渠道存在时，密谋的必要性下降</strong>。这不是说天才的世界更公正，而是说它提供了一个可以表演公正的舞台。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>三种秩序技术对应三种反抗形式：在裁判秩序里，反抗是「考得更好」；在科层秩序里，反抗是「密谋与站队」；在暴力秩序里，反抗是「活下来」。把这三者混为一谈，就会误读人物的动机——把天才的竞争读成内卷，把废土的密谋读成阴谋。</p>\n<p>本研究的边界是：图谱只记录被叙述的政治行为，不记录「未被叙述的服从」。而服从恰恰是秩序最日常的部分。要研究它，需要标注「未发生冲突的互动」，这超出了当前抽取的范围。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法用裁判维持秩序，我在废土世界扫垃圾用科层与暴力维持秩序，两者之间还有一层由密谋构成的灰色地带。秩序的形态决定了反抗的语法：<strong>一个世界里的人想着怎么赢，另一个世界里的人想着怎么活。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Ostrom, E. (1990). <em>Governing the Commons</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511807763</li><li>Scott, J. C. (2017). <em>Domination and the Arts of Resistance</em>. Yale University Press. https://doi.org/10.12987/9780300153569</li></ul>\n<blockquote><p>文献核验：以上 2 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"05-narrative","zh":"事件的功能语法：两本书共享的骨架与各自缺失的槽位","en":"The Functional Grammar of Events: A Shared Skeleton and Two Missing Slots","kzh":"普罗普功能项；叙事结构；事件类型；远读；双文本对照","n_ref":4,"chars":3365,"html":"<h1 id=\"事件的功能语法两本书共享的骨架与各自缺失的槽位\">事件的功能语法：两本书共享的骨架与各自缺失的槽位</h1>\n<p><strong>The Functional Grammar of Events: A Shared Skeleton and Two Missing Slots</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>把 833 与 2591 件事件按功能归约后，两本书显示出同一个骨架：日常、冲突、探索构成主干。差异在于槽位的缺失——天才基本法没有「战斗」这一功能项（0 件），我在废土世界扫垃圾几乎没有「成长学习」（7 件）。本文借用普罗普的功能项、巴特的叙事单位与莫莱蒂的远读，说明「缺失」比「出现」更能标识体裁。</p>\n<p><strong>Abstract:</strong> Reducing 833 and 2591 events to functional categories reveals a shared skeleton (daily life, conflict, exploration) and two telling absences: zero battle functions in Tiancai Jibenfa, and almost no learning functions in the wasteland novel. Absences, we argue, mark genre more sharply than presences.</p>\n<p><strong>关键词：</strong>普罗普功能项；叙事结构；事件类型；远读；双文本对照</p>\n<p><strong>Keywords:</strong> Proppian functions; narrative structure; event typology; distant reading; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>普罗普（Propp, 1968）研究童话时发现，故事的具体人物可以千变万化，功能项的序列却高度稳定。这个思路对长篇连载同样有效：把事件抽象成「谁对谁做了什么类型的事」，两本看起来毫不相干的书就会显示出同构。本文要问的是：同构在哪里，断裂又在哪里。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>《天才基本法》221 章 / 833 事件（每章 3.77 件）；《我在废土世界扫垃圾》439 章 / 2591 事件（每章 5.9 件）。事件按 15 个功能基类归约：日常生存、成长学习、冲突对峙、战斗、探索发现、副本任务、情报对话、密谋博弈、制度秩序、科研医疗、危机伤亡、撤离救援、记忆情感等。</p>\n<h3 id=\"22-方法\">2.2 方法</h3>\n<ul><li><strong>功能项分布</strong>：各基类的事件数与占比；</li><li><strong>结构位置</strong>：事件首章所在的阶段轴（天才 14 段、废土 43 段），用来看功能项是否集中在某类段落；</li><li><strong>网络视角</strong>：把人物—事件二部图投影到人物，观察叙事重心是否随情节推进迁移（Moretti, 2011）。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>归约词表由两书共用，这保证了可比性，也带来了偏向：词表对动作敏感、对心理活动不敏感。「其他」类占比（天才 4.8%、废土 14.6%）就是归约残差，本文不把它当作结论依据。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-共享骨架日常--冲突--探索\">3.1 共享骨架：日常 + 冲突 + 探索</h3>\n<p><strong>结论</strong>：两书占比最高的三类都落在「日常生存」（48% / 7.7%）、「冲突对峙」（11.2% / 3.4%）、「探索发现」（3.2% / 13%）上，只是排序不同。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> 计数，分母 833 / 2591 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>这是一个不太显眼但重要的结果：一本校园成长小说与一本废土生存小说，在功能层共享同一个骨架。差异不在「有哪些功能」，而在<strong>配比</strong>——天才的日常占近一半，废土的日常不到一成，剩下被探索与副本分走。巴特（Barthes, 1975）把叙事单位分为「功能」与「标志」，前者推动情节、后者铺陈氛围；从数据看，天才的标志性段落远多于废土，废土的功能性段落远多于天才。</p>\n<h3 id=\"32-两个空槽位\">3.2 两个空槽位</h3>\n<p><strong>结论</strong>：天才「战斗」0 件（0%），废土「成长学习」7 件（0.3%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：同 3.1 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>空槽位是体裁的指纹。一个成长小说可以完全没有战斗，因为它的冲突可以在规则内解决；一个废土小说可以几乎没有「学习」事件，因为它的能力增长被写在战斗与副本里。把这两个零放在一起看，&quot;缺失&quot;比&quot;出现&quot;更能说明一本书是什么。需要提醒的是，废土的学习事件少不等于人物不成长，而是<strong>成长不被叙述为学习</strong>（见本刊心理学一篇）。</p>\n<h3 id=\"33-结构位置功能项的分布形状\">3.3 结构位置：功能项的分布形状</h3>\n<p><strong>结论</strong>：天才的功能项在 14 个阶段上分布较均匀，日常类几乎每段都有；废土的探索与副本集中在特定阶段，日常类在后期显著下降。</p>\n<blockquote><p>可信度：中 ｜ 性质：推断（阶段划分为关键词切分 + 等长兜底）｜ 证据：<code>events[].type_base</code> × 阶段轴 ｜ 来源：<code>events.json</code> + <code>chapters.json</code></p></blockquote>\n<p>这一条只能到「中」：阶段划分本身是构造物，废土 43 段中有若干段样本极小，占比容易失真。但方向与阅读经验一致——废土前中期以探索建立世界，后期转向组织与战争，日常被压缩。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>埃维克与西尔贝（Ewick &amp; Silbey, 1995）指出，叙事不只是讲述，它同时在生产「什么算正常」。功能项分布正是这种生产的结果：一本书反复写哪类事件，就在反复确认哪类事值得被讲述。天才反复写日常与学习，等于宣布「平凡的努力值得记录」；废土反复写探索与战斗，等于宣布「活下去本身即是情节」。</p>\n<p>方法的边界在于：功能归约丢失了事件之间的因果链。普罗普的贡献不只是分类，更是序列；本研究目前只有分类，没有序列。要补上序列，需要抽取事件之间的因果/时序边，这是下一步的工作。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>两本书共享一个功能骨架，却在两个槽位上互为空缺。这个发现支持一个方法论主张：<strong>比较叙事的单位不该是情节，而该是功能项的分布</strong>。情节不可比，分布可比；而分布里的零，往往比非零更有信息量。</p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Barthes, R., &amp; Duisit, L. (1975). An Introduction to the Structural Analysis of Narrative. <em>New Literary History</em>, <em>6</em>(2), 237. https://doi.org/10.2307/468419</li><li>Ewick, P., &amp; Silbey, S. S. (1995). Subversive Stories and Hegemonic Tales: Toward a Sociology of Narrative. <em>Law &amp;amp; Society Review</em>, <em>29</em>(2), 197–226. https://doi.org/10.2307/3054010</li><li>Moretti, F. (2011). Network Theory, Plot Analysis. <em>New Left Review</em>, <em>2</em>(68), 80–102. https://doi.org/10.64590/vko</li><li>Propp, V. (1968). <em>Morphology of the Folktale</em>. University of Texas Press. https://doi.org/10.7560/783911</li></ul>\n<blockquote><p>文献核验：以上 4 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"06-education","zh":"学校的两副面孔：选拔装置与缺席的课堂","en":"Two Faces of Schooling: Selection Apparatus and the Absent Classroom","kzh":"教育社会学；制度化教育；内在动机；师徒制；双文本对照","n_ref":3,"chars":3175,"html":"<h1 id=\"学校的两副面孔选拔装置与缺席的课堂\">学校的两副面孔：选拔装置与缺席的课堂</h1>\n<p><strong>Two Faces of Schooling: Selection Apparatus and the Absent Classroom</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法是一本关于考试的小说：教育科研场所占 21.1%，成长学习事件占 15.7%，师徒关系 123 条。我在废土世界扫垃圾则几乎取消了学校：教育科研场所只占 2.6%，成长学习 7 件，师徒 29 条。本文讨论这两种教育想象的代价：一个把学习制度化到极致，一个让学习退回到学徒制与生存训练。</p>\n<p><strong>Abstract:</strong> Tiancai Jibenfa is a novel about examinations (21.1% of locations educational, 15.7% learning events), whereas the wasteland novel almost abolishes schooling (2.6%, 7 events). We examine what each imaginary gains and loses.</p>\n<p><strong>关键词：</strong>教育社会学；制度化教育；内在动机；师徒制；双文本对照</p>\n<p><strong>Keywords:</strong> sociology of education; institutionalised schooling; intrinsic motivation; apprenticeship; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>教育学讨论「学校是什么」时，通常有两个答案：选拔装置，或启蒙场所。两本小说的选择恰好分列两端——一本把学校写成全部世界的中心，一本让学校几乎不存在。本文用可计数的证据描述这两种想象，并追问各自的代价。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 221 章 / 256 地点 / 833 事件；废土 439 章 / 1037 地点 / 2591 事件。地点与事件使用同一套功能基类，便于跨书比较。</p>\n<h3 id=\"22-三个指标\">2.2 三个指标</h3>\n<ul><li><strong>教育空间占比</strong>：教育科研类地点 / 全部地点；</li><li><strong>学习事件密度</strong>：成长学习类事件 / 全部事件；</li><li><strong>师徒关系</strong>：<code>relations[].rel_base == &quot;师徒&quot;</code> 的条数（含跨章重复，仅作量级参考）。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>「成长学习」标签偏向「有明确教学关系」的事件，自学、顿悟、临场应变可能不被计入。因此废土的低值应读作「学习没有被写成教学」，而不是「没有学习」。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-一个把学校放大一个把学校删掉\">3.1 一个把学校放大，一个把学校删掉</h3>\n<p><strong>结论</strong>：教育科研类地点天才 54 处（21.1%），废土 27 处（2.6%）；成长学习事件 131 件（15.7%）对 7 件（0.3%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>locations[].type_base</code>、<code>events[].type_base</code> ｜ 来源：<code>locations.json</code> / <code>events.json</code></p></blockquote>\n<p>差距是两个数量级。天才的世界由学校组织：教室、办公室、考场、竞赛场地，人物的行动半径基本不出校园。废土的世界由据点与荒野组织，学校作为制度几乎不存在，知识以「老手带新手」的方式传递。伊里奇（Illich, 1995）批评制度化教育把学习变成消费，主张以「学习网络」取代学校；废土无意中实现了他的设想的一面——没有学校，只有现场；但也暴露了另一面：没有学校，也就没有可以被公平分配的入场券。</p>\n<h3 id=\"32-师徒是两书唯一共享的教育关系\">3.2 师徒是两书唯一共享的教育关系</h3>\n<p><strong>结论</strong>：天才师徒关系 123 条，废土 29 条；相对地，天才上下级 3 条，废土 267 条。</p>\n<blockquote><p>可信度：中 ｜ 性质：实测（含跨章重复，仅作量级）｜ 证据：<code>relations[].rel_base</code> ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>师徒是唯一在两书中都稳定存在的关系类型，这提示它可能是比学校更基础的叙事装置：一个知道的人，一个不知道的人，一段不可替代的传授。差别在于结果——天才的师徒关系通向考试与学历，废土的师徒关系通向活命。同样是「教」，一个教的是可迁移的符号能力，一个教的是不可迁移的处境知识。</p>\n<h3 id=\"33-内在动机需要安全的环境\">3.3 内在动机需要安全的环境</h3>\n<p><strong>结论</strong>：天才「冲突对峙」11.2% 而「危机伤亡」0.2%；废土「冲突对峙」3.4% 而「危机伤亡」4.9%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>瑞安与德西（Ryan &amp; Deci, 2000）指出，内在动机依赖自主、胜任、归属三种体验，而三者都需要一个<strong>允许失败</strong>的环境。天才提供了这个环境（伤亡近乎为零），所以它的学习可以出于兴趣；废土不提供，所以它的学习只能出于必要。德韦克（Dweck &amp; Leggett, 1988）的「渐进论」在这里也有了社会条件：相信能力可以增长，前提是失败不会致命。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>两种教育想象的代价是互补的。制度化教育能分配机会，但把学习异化为筛选，天才里那句「考试是唯一公平的事」既是信念也是控诉；非制度化教育保留了学习的实践性，却让机会随出身与运气分配。<strong>小说没有解决这个矛盾，它们只是把矛盾的两端各自写到底。</strong></p>\n<p>研究的边界：本文没有分析教师形象、课程内容与评价方式，这三者才是教育社会学的核心。图谱能提供的是空间与事件的骨架，具体教学互动的质地仍需细读。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法把学校写成命运的唯一入口，我在废土世界扫垃圾把学校写成已经失效的旧制度。前者证明了制度化教育的力量，后者证明了它的脆弱。两本书合起来，恰好构成一份关于「教育能做什么、不能做什么」的对照实验。</p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Dweck, C. S., &amp; Leggett, E. L. (1988). A social-cognitive approach to motivation and personality. <em>Psychological Review</em>, <em>95</em>(2), 256–273. https://doi.org/10.1037/0033-295x.95.2.256</li><li>Illich, I. (1995). <em>Deschooling Society</em>. Equinox Publishing Ltd.. https://doi.org/10.1558/isbn.9780714520704</li><li>Ryan, R. M., &amp; Deci, E. L. (2000). Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being. <em>American Psychologist</em>, <em>55</em>(1), 68–78. https://doi.org/10.1037/0003-066x.55.1.68</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"07-geography","zh":"定点叙事与移动叙事：空间复用率的两种极端","en":"Fixed-point versus Mobile Narrative: Two Extremes of Spatial Reuse","kzh":"空间社会学；场所；场景复用；坐标缺失；双文本对照","n_ref":1,"chars":2838,"html":"<h1 id=\"定点叙事与移动叙事空间复用率的两种极端\">定点叙事与移动叙事：空间复用率的两种极端</h1>\n<p><strong>Fixed-point versus Mobile Narrative: Two Extremes of Spatial Reuse</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法 256 处地点只承载 833 件事件，前十大场景占 33.4%，单个「院长办公室」就占 7.4%；我在废土世界扫垃圾 1037 处地点承载 2591 件事件，前十大场景只占 9%，最高的一处仅 1.2%。前者是定点叙事，后者是移动叙事。空间复用率的差距，直接决定了两本书的读者体验与人物关系形态。</p>\n<p><strong>Abstract:</strong> With 256 locations and 833 events, Tiancai Jibenfa concentrates 33.4% of events in ten scenes, one office alone taking 7.4%. The wasteland novel spreads 2591 events over 1037 locations, with only 9% in its top ten. The contrast separates fixed-point from mobile narrative.</p>\n<p><strong>关键词：</strong>空间社会学；场所；场景复用；坐标缺失；双文本对照</p>\n<p><strong>Keywords:</strong> sociology of space; place; scene reuse; missing coordinates; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>吉里恩（Gieryn, 2000）提醒社会学家：地点不是事件的背景板，而是被社会过程生产出来的东西，同时反过来塑造社会关系。两本小说对「地点」的使用几乎相反——一本反复回到同一个房间，一本不断离开。这种差异可以被量化：场景复用率。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才：256 处地点 / 833 件事件；废土：1037 处地点 / 2591 件事件。地点按功能基类归约（据点驻地、居住空间、教育科研、交通通道、自然地貌、管制边界、遗迹尸骸等）。</p>\n<h3 id=\"22-指标\">2.2 指标</h3>\n<ul><li><strong>场景复用率</strong>：前十大地点承载的事件数 / 有地点事件数；</li><li><strong>单点强度</strong>：承载事件最多的地点所占比例；</li><li><strong>无地点事件</strong>：<code>events[].location</code> 为空的事件数（衡量叙述的空间依附度）。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>坐标状态必须说明：天才 256 处、废土 1037 处<strong>全部没有真实经纬度</strong>，报告内地图为示意。因此本文只讨论「场景之间的关系」，不讨论现实地理。地点匹配采用精确名称匹配，别称不计入，复用率因此是<strong>下限</strong>。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-一个办公室装下了-74-的事件\">3.1 一个办公室装下了 7.4% 的事件</h3>\n<p><strong>结论</strong>：天才事件最集中的地点是「院长办公室」，62 件（7.4%）；前十大地点合计 278 件（33.4%）。废土最集中的是「教堂（意识体云端）」，30 件（1.2%）；前十合计 9%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].location</code> 与 <code>locations[].name</code> 精确匹配，分母 833 / 2591 ｜ 来源：<code>events.json</code> / <code>locations.json</code></p></blockquote>\n<p>33.4% 对 9%，差了三倍多。天才的空间是<strong>高压复用</strong>的：一个办公室既是办公场所、又是谈话场所、又是秘密被揭穿的地方，同一空间承担多种功能，读者因此获得熟悉感。废土的空间是<strong>低复用</strong>的：每进入一个新区域就换一批场景，读者获得的是探索感。这两种体验对应两种叙事经济——前者省场景、换深度，后者费场景、换广度。</p>\n<h3 id=\"32-空间类型的两种配方\">3.2 空间类型的两种配方</h3>\n<p><strong>结论</strong>：天才的地点以据点驻地（69 处，27%）与教育科研（54 处，21.1%）为主，医疗场所只有 2 处；废土以据点驻地（312 处，30.1%）、居住空间（172 处）、交通通道（123 处）、自然地貌（123 处）为主，并有天才完全没有的「管制边界」40 处与「遗迹尸骸」40 处。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>locations[].type_base</code> ｜ 来源：<code>locations.json</code></p></blockquote>\n<p>「管制边界」与「遗迹尸骸」这两个类目只在废土出现，它们本身就是世界观声明：一个有边界要守，一个有尸体要清。天才没有这两个类目，因为它的世界不需要用边界与尸体来定义危险。<strong>地点的类型表，就是世界的类型表。</strong></p>\n<h3 id=\"33-无地点事件的比例\">3.3 无地点事件的比例</h3>\n<p><strong>结论</strong>：天才 87 件事件没有地点（87 / 833），废土 45 件。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].location</code> 为空 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>绝对数差距大，但比例都不高。这说明两书的叙述都高度依附于具体场所——即便是废土的移动叙事，事件也总要发生在某个地方。这一点常被忽视：<strong>「移动」不等于「无地点」，只是地点不断更换</strong>。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>空间复用率可以解释一个阅读体验上的差异：读天才时，读者脑中会形成一张很小的地图，几个房间反复出现，人物在其中的位置本身就是信息（谁坐在谁的对面）；读废土时，地图不断扩张，读者记住的是「去过哪类地方」而不是「哪个房间」。前者接近舞台剧，后者接近公路片。</p>\n<p>边界在于：地点抽取偏向有名字的场所，走廊、街道这类过渡空间大量遗漏。若把它们补上，废土的移动叙事会更明显，天才的定点叙事则变化不大。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法用 256 处地点讲一个高度集中的故事，我在废土世界扫垃圾用 1037 处地点讲一个不断扩张的故事。空间不是背景，它是叙事节奏的物理形态：<strong>复用率高的书，时间在同一个房间里流逝；复用率低的书，时间在移动中流逝。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Gieryn, T. F. (2000). A Space for Place in Sociology. <em>Annual Review of Sociology</em>, <em>26</em>(1), 463–496. https://doi.org/10.1146/annurev.soc.26.1.463</li></ul>\n<blockquote><p>文献核验：以上 1 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"08-networks","zh":"星形、团块与重复边：小说人物网络的两种拓扑","en":"Stars, Clusters, and Repeated Edges: Two Topologies of Fictional Character Networks","kzh":"复杂网络；度分布；连通分量；弱关系；双文本对照","n_ref":4,"chars":3188,"html":"<h1 id=\"星形团块与重复边小说人物网络的两种拓扑\">星形、团块与重复边：小说人物网络的两种拓扑</h1>\n<p><strong>Stars, Clusters, and Repeated Edges: Two Topologies of Fictional Character Networks</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>去重后，天才基本法的关系网络有 59 个有边节点、80 条边、1 个连通分量，最大度 29（林朝夕），度=1 的节点占 67.8%；我在废土世界扫垃圾有 293 个节点、492 条边、6 个分量，最大度 126（祝宁），度=1 占 51.9%。本文讨论两种拓扑对叙事的功能：星形网络制造聚焦，团块网络制造纵深。</p>\n<p><strong>Abstract:</strong> After de-duplication, Tiancai Jibenfa forms a star (59 nodes, 80 edges, 1 component, max degree 29), while the wasteland novel forms 6 clusters (293 nodes, 492 edges, max degree 126). We discuss what each topology does for narrative.</p>\n<p><strong>关键词：</strong>复杂网络；度分布；连通分量；弱关系；双文本对照</p>\n<p><strong>Keywords:</strong> complex networks; degree distribution; connected components; weak ties; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>莫莱蒂（Moretti, 2011）用网络分析研究《哈姆雷特》时提出一个朴素的洞见：把人物当节点、把互动当边，故事的结构就会显形。这个方法的陷阱在于数据质量——如果同一条边被反复记录，度中心性测到的就不是社交广度，而是「被重复提到的次数」。本文先把这件事说清楚，再谈拓扑。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 482 条关系记录、140 位人物；废土 1606 条、379 位。所有关系按无向对去重：<code>(A,B)</code> 与 <code>(B,A)</code> 合并，同一对只计一次。</p>\n<h3 id=\"22-指标\">2.2 指标</h3>\n<p>度、平均度、度分布、连通分量、最大分量占比、度=1 节点占比。全部基于去重图。</p>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>图谱的边来自「书里明确写了的关系」，弱关系（同班同学、路人搭话）大量缺失。因此这里的网络是<strong>叙述网络</strong>，不是<strong>虚构社会网络</strong>。孤立点不等于人物孤僻，只等于「没有被写出关系」。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-顶点度数背后是重复计数\">3.1 顶点度数背后是重复计数</h3>\n<p><strong>结论</strong>：天才 482 条记录去重后 80 对（6.03 条/对），废土 1606 条去重后 492 对（3.26 条/对）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].from/to</code> 无向去重 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>这一条必须先讲，因为它会改写所有排名。按原始条数，某些配角会因为「跨 50 章反复出现同一关系」而进入核心圈；按去重口径，他们只有两三个邻居。把重复当强度，是网络分析在文学数据上最常见的错误。</p>\n<h3 id=\"32-星形与多团块\">3.2 星形与多团块</h3>\n<p><strong>结论</strong>：天才 1 个连通分量、最大分量 59 节点（占全部人物 42.1%）、平均度 2.71；废土 6 个分量、最大分量 283 节点（74.7%）、平均度 3.36。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：去重图连通性 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>天才只有一个分量，意味着所有有关系的人物都连成一片——这是一张<strong>单中心</strong>的图，任何两个人之间最多经过一个枢纽。废土有六个分量，最大者占七成半，其余五成碎片——这是<strong>组织型</strong>的图，存在若干互不相通的小圈子（某些副本队伍、某些据点的人）。瓦茨与斯特罗格茨（Watts &amp; Strogatz, 1998）讨论小世界时强调「局部密集 + 少量长程连接」，天才缺的正是局部密集：它没有次级社团，只有中心与外围。</p>\n<h3 id=\"33-度分布没有无标度只有一颗星\">3.3 度分布：没有无标度，只有一颗星</h3>\n<p><strong>结论</strong>：天才最大度 29（林朝夕），度=1 的节点占 67.8%；废土最大度 126（祝宁），度=1 占 51.9%。</p>\n<blockquote><p>可信度：中 ｜ 性质：推断（样本量小，未做幂律拟合）｜ 证据：同 3.2 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>巴拉巴西与阿尔伯特（Barabási &amp; Albert, 1999）的优先连接模型预测度分布呈幂律：少数超级节点、大量长尾。两本书都不符合——它们更像「一个中心和一圈叶子」。这不是模型失效，而是<strong>叙述的选择性</strong>：小说只写推动情节的关系，不写随机社交，于是网络被压成了星形。样本量（59 / 293 个有边节点）也不足以做分布拟合，所以本条只列为推断。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>格兰诺维特（Granovetter, 1973）的弱关系理论在这里有一个有趣的变体：天才的弱关系几乎不存在（度=1 的叶子占 67.8%），所有信息都必须经过中心；废土的弱关系更多（度=1 占 51.9%），信息可以在圈子之间横向流动。这可以解释两书情报类事件的差距——天才 3.2%，废土 9.1%。<strong>信息量不是由人物多少决定的，而是由网络的横向连通度决定的。</strong></p>\n<p>边界在于：关系抽取以「明确表述」为准，隐含关系（同校、同乡、曾经见过）没有入图。补上这些边会提高连通度，但两书的相对差异方向不太可能反转。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>一个是星，一个是团块。星形让故事聚焦，代价是所有人都必须经过同一个人；团块让故事有纵深，代价是读者要记住更多名字。网络拓扑不只是结构描述，它同时也是<strong>叙事成本的分配方案</strong>。</p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Barabási, A. L., &amp; Albert, R. (1999). Emergence of Scaling in Random Networks. <em>Science</em>, <em>286</em>(5439), 509–512. https://doi.org/10.1126/science.286.5439.509</li><li>Granovetter, M. S. (1973). The Strength of Weak Ties. <em>American Journal of Sociology</em>, <em>78</em>(6), 1360–1380. https://doi.org/10.1086/225469</li><li>Moretti, F. (2011). Network Theory, Plot Analysis. <em>New Left Review</em>, <em>2</em>(68), 80–102. https://doi.org/10.64590/vko</li><li>Watts, D. J., &amp; Strogatz, S. H. (1998). Collective dynamics of ‘small-world’ networks. <em>Nature</em>, <em>393</em>(6684), 440–442. https://doi.org/10.1038/30918</li></ul>\n<blockquote><p>文献核验：以上 4 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"09-linguistics","zh":"称谓的语法：谁被叫「同学」，谁被叫「姐」","en":"The Grammar of Address: Who Is Called Classmate, Who Is Called Sister","kzh":"社会语言学；称谓；礼貌策略；别名；双文本对照","n_ref":2,"chars":2801,"html":"<h1 id=\"称谓的语法谁被叫同学谁被叫姐\">称谓的语法：谁被叫「同学」，谁被叫「姐」</h1>\n<p><strong>The Grammar of Address: Who Is Called Classmate, Who Is Called Sister</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>两书共 166 与 479 个别名，覆盖 40% 与 53% 的人物。称谓词表统计显示：天才基本法以「同学」12 次、「叔」9 次、「老师」8 次为主；我在废土世界扫垃圾以「姐」19 次、「老板」14 次、「队长」10 次为主。称谓不是同义词，而是关系位置的编码——它标记的是「谁有资格怎么叫谁」。</p>\n<p><strong>Abstract:</strong> Across 166 and 479 aliases, address terms cluster differently: classroom terms dominate in Tiancai Jibenfa, while kinship-and-rank terms dominate in the wasteland novel. Following politeness theory, we read aliases as encodings of relational position rather than lexical variants.</p>\n<p><strong>关键词：</strong>社会语言学；称谓；礼貌策略；别名；双文本对照</p>\n<p><strong>Keywords:</strong> sociolinguistics; terms of address; politeness; aliases; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>一个人被怎么称呼，取决于三件事：谁在叫、在什么场合叫、彼此的地位差多少。布朗与列文森（Brown &amp; Levinson, 1987）把这些因素概括为礼貌策略：称呼既可以拉近距离，也可以标记距离。小说里的别名因此不是文本噪音，而是<strong>社会关系的压缩编码</strong>。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 140 位人物、166 个别名；废土 379 位人物、479 个别名。别名由抽取阶段从正文收集，含昵称、职称、亲属称谓、外号。</p>\n<h3 id=\"22-方法\">2.2 方法</h3>\n<ul><li><strong>覆盖</strong>：有至少一个别名的人物比例；</li><li><strong>称谓词表</strong>：在别名字符串中做子串计数，词表 10 项（同学、老师、叔、哥、姐、老板、队长、阿姨、主任、医生）。这是词表命中，不是分词，因此会有误伤（如人名含「哥」字），本文只比较量级与排序。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>称谓统计依赖抽取时是否把某个说法收进 aliases，收录标准两书不完全一致。跨书比较只看<strong>相对排序</strong>，不看绝对数。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-校园语域与组织语域\">3.1 校园语域与组织语域</h3>\n<p><strong>结论</strong>：天才的高频称谓是「同学」12、「叔」9、「老师」8、「哥」6；废土是「姐」19、「老板」14、「队长」10、「哥」9。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测（词表命中，非分词）｜ 证据：<code>characters[].aliases</code> 子串计数 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>两组词表几乎是两个世界的词典。校园语域的称谓建立在<strong>共同在场</strong>上：同学、老师、师兄，都预设了一个共享的机构空间。组织语域的称谓建立在<strong>功能与资历</strong>上：队长、老板、姐，预设的是任务与辈分。「姐」在废土出现 19 次而天才只有 3 次，这个差距不是用词习惯，而是社会结构的投影——废土有需要被安抚的年长强者，天才没有。</p>\n<h3 id=\"32-别名的密度差\">3.2 别名的密度差</h3>\n<p><strong>结论</strong>：天才 40% 的人物有别名，废土 53%。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>characters[].aliases</code> 非空计数 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>废土的别名密度更高，且集中在有组织身份的人物身上。这与「组织需要称呼」的直觉一致：一支队伍必须能在战场上快速指认彼此，于是代号、职称、简称被大量生产。天才的别名更多来自亲属与校园关系，数量少但跨度大。</p>\n<h3 id=\"33-对白的可归属率写法差异而非抽取失败\">3.3 对白的可归属率：写法差异而非抽取失败</h3>\n<p><strong>结论</strong>：天才入选对白 25 条，可归属到说话人的 10 条（40%）；废土 171 条中 156 条（91.2%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>quotes.json.meta</code> ｜ 来源：<code>quotes.json</code></p></blockquote>\n<p>这个差距常被误读成「废土的对话更好抽取」。真正的原因是<strong>写法</strong>：天才的对白多写成独立成段的引号，前后没有「某某说」的标签；废土的对话更常带说话人提示。巴特（Barthes, 1975）在讨论叙事单位时指出，对话的归属标记本身就是一种叙述选择——选择标注，就是选择让读者不必猜测。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>把称谓与对白归属放在一起，可以看到一个共同的机制：<strong>文本在多大程度上替读者完成社交推断</strong>。天才要求读者自己判断「这句话是谁说的、这个人为什么这样称呼对方」，废土则大量代劳。前者阅读成本高、沉浸感强，后者节奏快、指向明确。</p>\n<p>方法的边界是明显的：子串计数会把「小哥」「表哥」重复计入「哥」，也会漏掉不带这些字的称谓（如「师父」）。若要做严格的称谓语研究，需要分词与人工校对，本文只提供量级与方向。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>称谓是一张微型的社会地图。天才的地图上写着同学、老师、叔叔，废土的地图上写着姐、老板、队长。两本书用不同的词，标注了同一种东西：<strong>谁有资格开口，以及开口时该用哪个词。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Barthes, R., &amp; Duisit, L. (1975). An Introduction to the Structural Analysis of Narrative. <em>New Literary History</em>, <em>6</em>(2), 237. https://doi.org/10.2307/468419</li><li>Brown, P., Levinson, S. C., &amp; Gumperz, J. J. (1987). <em>Politeness</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511813085</li></ul>\n<blockquote><p>文献核验：以上 2 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"10-communication","zh":"信息的两种流通：教室里讲，废墟里传","en":"Two Channels of Information: Taught in Class, Carried through Ruins","kzh":"信息论；传播网络；情报与密谋；信息不对称；双文本对照","n_ref":2,"chars":2833,"html":"<h1 id=\"信息的两种流通教室里讲废墟里传\">信息的两种流通：教室里讲，废墟里传</h1>\n<p><strong>Two Channels of Information: Taught in Class, Carried through Ruins</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法里信息类事件（情报对话 + 密谋博弈）只占 3.2% + 1.2%，合计 4.4%；我在废土世界扫垃圾则占 17.1%（442 件）。前者把信息流通写成教学（成长学习 15.7%），后者写成情报与密谋。本文用香农的通道模型与斯科特的隐藏文本说明：信息在哪个通道里流动，决定了它是否被当作「知识」。</p>\n<p><strong>Abstract:</strong> Information events make up 4.4% of events in Tiancai Jibenfa but 17.1% in the wasteland novel. The former channels information through teaching, the latter through intelligence and conspiracy. Channel choice determines whether information is treated as knowledge or as leverage.</p>\n<p><strong>关键词：</strong>信息论；传播网络；情报与密谋；信息不对称；双文本对照</p>\n<p><strong>Keywords:</strong> information theory; communication networks; intelligence and conspiracy; information asymmetry; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>香农（Shannon, 1948）把通信拆成信源、编码、信道、解码、信宿五要素，并指出噪声是通道的固有属性。小说里的信息流通同样有通道：课堂是一个低噪声通道（有教材、有考试、可校验），废墟是一个高噪声通道（传闻、谎言、被截断的消息）。两本书选择了不同的通道，因此同一件事——知道与不知道——被写成了不同的情节。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 833 件事件 / 221 章；废土 2591 件事件 / 439 章。信息类事件定义为「情报对话」与「密谋博弈」两类之和。</p>\n<h3 id=\"22-指标\">2.2 指标</h3>\n<ul><li><strong>信息事件占比</strong>：<code>(情报对话 + 密谋博弈) / 全部事件</code>；</li><li><strong>替代通道</strong>：成长学习事件的占比（知识通过教学传递）；</li><li><strong>参与者规模</strong>：信息类事件的平均参与者人数（衡量通道的公开程度）。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>情报与密谋的界线在归约时依赖事件描述，同一事件可能被判为「冲突」而非「情报」。因此占比应看量级，不宜做小数点级比较。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-一条是教学通道一条是情报通道\">3.1 一条是教学通道，一条是情报通道</h3>\n<p><strong>结论</strong>：天才信息类事件 37 件（4.4%），成长学习 131 件（15.7%）；废土信息类 442 件（17.1%），成长学习 7 件（0.3%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> 计数，分母 833 / 2591 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>两书的信息总量并没有数量级差距，但通道完全不同。天才的知识通过课堂单向广播：一个人讲，一群人听，考试负责校验。废土的知识通过传闻与密谋多向流动：谁都不知道全部真相，每个人只掌握一段。用香农的术语说，天才的信道噪声低但带宽窄（只有老师能讲），废土的信道噪声高但节点多（人人都能传）。</p>\n<h3 id=\"32-密谋是信息不对称的产物\">3.2 密谋是信息不对称的产物</h3>\n<p><strong>结论</strong>：天才密谋博弈 10 件（1.2%），废土 207 件（8%），差 8/1.2 倍。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：同 3.1 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>斯科特（Scott, 2017）的隐藏文本理论解释了这种差距：密谋出现在「公开表达无效且危险」的场合。天才的世界里有申诉渠道（考试、举报、评审），因此不需要密谋；废土的世界里没有，于是密谋成为唯一的政治技术。<strong>密谋的密度，可以当作制度开放度的反向指标。</strong></p>\n<h3 id=\"33-信息事件的规模\">3.3 信息事件的规模</h3>\n<p><strong>结论</strong>：天才信息类事件平均参与者约 2–3 人，废土相近，但废土的信息事件总量是天才的 442/37 倍。</p>\n<blockquote><p>可信度：中 ｜ 性质：实测（均值口径，样本受群体称谓影响）｜ 证据：<code>events[].participants</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>规模相近说明两书的信息交换都是<strong>小圈行为</strong>，不是公开广播。这与「教学通道」的直觉相反：即便在天才里，真正推动情节的信息也不是课堂上讲的那些，而是课后几个人之间的低语。课堂提供的是合法性，小圈提供的是情节。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>把通道选择与体裁放在一起，会看到一个循环：世界越危险，信息越值钱；信息越值钱，隐瞒越普遍；隐瞒越普遍，密谋越多。废土的 8% 不是作者偏爱阴谋，而是这个世界观的必然产物。反过来，天才的 1.2% 也不是天真，而是制度提供了替代品。</p>\n<p>边界在于：本文只统计被明确标注为「情报」「密谋」的事件，隐含的信息传递（暗示、误会、误读）没有入表。这类隐性信息恰恰是文学性最强的部分，量化方法在这里有天然上限。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法让信息走教室，我在废土世界扫垃圾让信息走废墟。前者把知道写成学习，后者把知道写成筹码。同一个「信息」，在两种通道里获得了两种价值——<strong>一个用来考试，一个用来活命。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Scott, J. C. (2017). <em>Domination and the Arts of Resistance</em>. Yale University Press. https://doi.org/10.12987/9780300153569</li><li>Shannon, C. E. (1948). A Mathematical Theory of Communication. <em>Bell System Technical Journal</em>, <em>27</em>(3), 379–423. https://doi.org/10.1002/j.1538-7305.1948.tb01338.x</li></ul>\n<blockquote><p>文献核验：以上 2 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"11-law","zh":"规则的两种效力：有裁判的秩序与例外状态","en":"Two Kinds of Legal Efficacy: Adjudicated Order and the State of Exception","kzh":"法社会学；程序正义；例外状态；暴力与法；双文本对照","n_ref":3,"chars":3127,"html":"<h1 id=\"规则的两种效力有裁判的秩序与例外状态\">规则的两种效力：有裁判的秩序与例外状态</h1>\n<p><strong>Two Kinds of Legal Efficacy: Adjudicated Order and the State of Exception</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>两书「制度秩序」事件占比完全相同（均为 2.8%），但性质相反：天才基本法的秩序由可申诉的规则维持（战斗 0 件、危机伤亡 2 件），我在废土世界扫垃圾的秩序由例外状态维持（战斗 363 件、危机伤亡 128 件、支配关系 48 条）。本文借科弗「暴力与言说」的论题说明：法的效力不在条文，而在它能否把暴力收进程序。</p>\n<p><strong>Abstract:</strong> Institutional-order events share the same share (2.8%) in both novels, yet mean opposite things: one order is appealable (zero battles), the other rests on exception (363 battles, 128 casualties). Following Cover, we argue that law&#x27;s efficacy lies in whether it can channel violence into procedure.</p>\n<p><strong>关键词：</strong>法社会学；程序正义；例外状态；暴力与法；双文本对照</p>\n<p><strong>Keywords:</strong> sociology of law; procedural justice; state of exception; violence and law; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>科弗（Cover, 1986）有一个著名的判断：法律解释的行为本身就包含暴力，因为法的意义最终由「谁被强制」来兑现。这个判断在两本小说里得到了两种截然不同的演示——一本把暴力彻底移出叙事（战斗 0 件），一本让暴力成为秩序的日常（战斗 363 件）。本文比较这两种「法的效力」。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 833 事件 / 482 关系；废土 2591 事件 / 1606 关系。事件与关系使用同一套基类，便于对照。</p>\n<h3 id=\"22-指标\">2.2 指标</h3>\n<ul><li><strong>程序密度</strong>：制度秩序事件数（考试规则、评审、处分、规章）；</li><li><strong>暴力水平</strong>：战斗与危机伤亡事件数；</li><li><strong>强制关系</strong>：支配、上下级、敌对三类关系条数。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>「制度秩序」是归约标签，可能同时包含校规、组织纪律、据点公约。本文用它衡量<strong>密度</strong>，性质判定依赖具体事件阅读。另需说明：关系条数含跨章重复，仅作量级参考。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-相同的密度相反的效力\">3.1 相同的密度，相反的效力</h3>\n<p><strong>结论</strong>：天才制度秩序 23 件（2.8%），废土 72 件（2.8%），占比相同；但天才战斗 0 件，废土 363 件（14%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> 计数，分母 833 / 2591 ｜ 来源：<code>events.json</code></p></blockquote>\n<p>相同的百分比掩盖了完全不同的东西。天才的制度是<strong>可援引</strong>的：学生可以质疑评分、可以举报不公、可以要求重考，规则在冲突中被反复调用，所以被大量叙述。废土的制度是<strong>可执行的</strong>：据点准入、物资分配、队伍纪律，规则不需要被援引，只需要被服从。科弗的论题在这里分化成两支——前者靠言说维持，后者靠强制维持。</p>\n<h3 id=\"32-暴力是否被程序吸收\">3.2 暴力是否被程序吸收</h3>\n<p><strong>结论</strong>：天才危机伤亡 2 件（0.2%），废土 128 件（4.9%）；敌方关系天才 21 条，废土 128 条；支配关系天才 0 条，废土 48 条。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code>、<code>relations[].rel_base</code> ｜ 来源：<code>events.json</code> / <code>relations.json</code></p></blockquote>\n<p>天才把暴力吸收进了程序：冲突密度不低（11.2%），但后果极轻（0.2%）。这不是因为世界和平，而是因为<strong>暴力被移交给了裁判</strong>——扣分、取消资格、记过，都是暴力的替代物。废土没有这个移交机制，冲突直接兑现为伤亡。埃维克与西尔贝（Ewick &amp; Silbey, 1995）所说的「霸权故事」在这里显出功能：天才反复讲述「规则会给你公道」，这个故事本身就是秩序的维持装置。</p>\n<h3 id=\"33-例外状态的生产\">3.3 例外状态的生产</h3>\n<p><strong>结论</strong>：废土撤离救援 31 件（1.2%）、危机伤亡 4.9%，而天才撤离救援 0 件。</p>\n<blockquote><p>可信度：中 ｜ 性质：推断（类型归约对「救援」的判定依赖事件描述）｜ 证据：<code>events[].type_base</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>「撤离救援」是一个只在废土出现的类目。它的存在意味着：常态秩序会周期性失效，需要专门的叙事装置来处理失效。这正是例外状态的经验形态——规则暂停，权力临时集中，事后无人追责。天才没有这个类目，因为它的秩序从不失效，至少不被写成失效。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>两种法想象的代价同样互补。可申诉的秩序需要大量程序成本（考试、评审、复核），并且只能在资源相对充裕的世界里维持；例外状态的秩序成本低、响应快，但把每个人置于潜在的可支配位置。奥斯特罗姆（Ostrom, 1990）关于自治规则的研究提示第三条路：规则由参与者共同制定。两本书都没有走这条路——天才的规则由学校制定，废土的规则由据点制定。</p>\n<p>边界在于：本文的「法」是广义的社会规则，不是国家法。两书都没有明确的法律机构，因此结论应理解为「秩序技术」的比较，而非法理学判断。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法展示了一种把暴力收进程序的秩序，我在废土世界扫垃圾展示了一种以例外为常态的秩序。两者都有效，但效力的来源相反：<strong>一个来自「你可以申诉」，一个来自「你不能申诉」。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Cover, R. M. (1986). Violence and the Word. <em>The Yale Law Journal</em>, <em>95</em>(8), 1601. https://doi.org/10.2307/796468</li><li>Ewick, P., &amp; Silbey, S. S. (1995). Subversive Stories and Hegemonic Tales: Toward a Sociology of Narrative. <em>Law &amp;amp; Society Review</em>, <em>29</em>(2), 197–226. https://doi.org/10.2307/3054010</li><li>Ostrom, E. (1990). <em>Governing the Commons</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511807763</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"12-ethics","zh":"救助的分布：关怀伦理与配给伦理","en":"The Distribution of Rescue: Ethics of Care versus Ethics of Rationing","kzh":"关怀伦理；救助关系；资源分配；互惠；双文本对照","n_ref":2,"chars":2748,"html":"<h1 id=\"救助的分布关怀伦理与配给伦理\">救助的分布：关怀伦理与配给伦理</h1>\n<p><strong>The Distribution of Rescue: Ethics of Care versus Ethics of Rationing</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法的救助关系 8 条去重后仅 8 个有向对，双向 1 对；我在废土世界扫垃圾 52 条去重后 52 对，双向 7 对。前者是少数人对一个人的长期保护，后者是分散在组织内的互助网络。本文用关怀伦理与公地治理两套框架说明：两种伦理都成立，但一个是关系性的，一个是制度性的。</p>\n<p><strong>Abstract:</strong> Rescue relations collapse to only 8 directed pairs in Tiancai Jibenfa (1 mutual) versus 52 pairs in the wasteland novel (7 mutual). The former is long-term protection by a few; the latter is a distributed mutual-aid network. Care ethics and commons governance explain the two regimes.</p>\n<p><strong>关键词：</strong>关怀伦理；救助关系；资源分配；互惠；双文本对照</p>\n<p><strong>Keywords:</strong> ethics of care; rescue relations; resource allocation; reciprocity; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>伦理学的经验入口通常很难找：小说里的人都在做选择，但「选择」很少被标注。救助关系提供了一个可计数的替代物——谁救谁、救了几次、是否双向。这些记录不能告诉我们人物「为什么」救，但能告诉我们<strong>救助在社会结构里如何分布</strong>。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 482 条关系记录、140 位人物；废土 1606 条、379 位。救助关系取 <code>relations[].rel_base == &quot;救助&quot;</code>，按有向对去重后统计。</p>\n<h3 id=\"22-指标\">2.2 指标</h3>\n<ul><li><strong>救助对数</strong>：去重后的有向对数量；</li><li><strong>双向比例</strong>：互为施救者的对数，衡量互惠程度；</li><li><strong>伤亡暴露</strong>：危机伤亡事件占比，衡量「需要被救」的频率。</li></ul>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>关系条数受跨章重复影响，因此同时给出去重值与原始值。救助的判定依赖事件与关系描述中的动词，隐含的照护（做饭、陪护、垫钱）没有计入，这会使「关怀」被系统性低估。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-集中保护与分散互助\">3.1 集中保护与分散互助</h3>\n<p><strong>结论</strong>：天才救助 58 条记录 → 8 个有向对（平均每对约 7 条），双向 1 对；废土 128 条 → 52 对（平均每对约 2–3 条），双向 7 对。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].rel_base</code> 去重 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>天才有 58 条救助记录却只涉及 8 组关系——平均每组被记录 7 次以上。这说明救助是<strong>少数关系的反复书写</strong>：同一个人反复被同几个人救。废土的 128 条分散在 52 个对上，平均每组 2–3 次，是<strong>多点低强度的互助</strong>。前者像家庭，后者像制度。</p>\n<h3 id=\"32-互惠的两种形态\">3.2 互惠的两种形态</h3>\n<p><strong>结论</strong>：天才双向救助 1 对，废土 7 对（占各自对数的 7/52）。</p>\n<blockquote><p>可信度：中 ｜ 性质：实测（分母小，比率不稳）｜ 证据：同 3.1 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>天才的双向救助极少，关怀是<strong>单向的</strong>：长辈护晚辈、老师护学生，受助者很少有机会回报。这与赫尔德（Held, 2005）描述的关怀伦理高度吻合——关怀的价值不在于对等交换，而在于对具体他者的持续回应。废土的双向比例更高，因为组织内的互助必须可预期：今天我背你回来，明天你替我挡一次。这是公地治理的逻辑（Ostrom, 1990）：规则之所以被遵守，是因为每个人都可能轮到需要它。</p>\n<h3 id=\"33-需要被救的频率\">3.3 需要被救的频率</h3>\n<p><strong>结论</strong>：天才危机伤亡 2 件（0.2%），废土 128 件（4.9%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>废土的救助对数是天才的六倍多，但伤亡事件是六十倍。<strong>需求增长远快于供给增长</strong>——这是废土伦理困境的量化形态：互助网络存在，但不够用。天才的伤亡几乎为零，所以它的关怀可以从容、可以长期、可以不求回报。赫尔德强调关怀需要条件，这个条件在两书中表现为伤亡率。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>把两组数字并置，会得到一个不舒服的结论：<strong>关怀伦理的可行性依赖于低伤亡环境</strong>。当伤亡率上升两个数量级，单向的、长期的、不计回报的关怀就难以维持，取而代之的是可计算的互惠。这不是说废土的人更自私，而是说那里的伦理形式被生存条件重塑了。</p>\n<p>边界在于：本文只统计「救助」这一种伦理行为，没有覆盖欺骗、背叛、牺牲等负向或高风险行为。完整的伦理图景需要把这些也纳入，而那需要更细的事件标注。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法的伦理是关怀的：少数人对一个人长期负责，不要求回报。我在废土世界扫垃圾的伦理是配给的：互助被组织化、被计价、被期待回报。两种伦理都能成立，但它们各自需要一个世界来支撑——<strong>一个允许慢慢来的世界，一个不允许的世界。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Held, V. (2005). <em>The Ethics of Care</em>. Oxford University PressNew York. https://doi.org/10.1093/0195180992.001.0001</li><li>Ostrom, E. (1990). <em>Governing the Commons</em>. Cambridge University Press. https://doi.org/10.1017/cbo9780511807763</li></ul>\n<blockquote><p>文献核验：以上 2 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"13-gender","zh":"能被判定的只有十分之一：性别分析的样本边界","en":"Only One in Ten Is Decidable: The Sample Boundary of Gender Analysis","kzh":"性别研究；数据缺口；代词推断；样本偏差；方法论","n_ref":3,"chars":2824,"html":"<h1 id=\"能被判定的只有十分之一性别分析的样本边界\">能被判定的只有十分之一：性别分析的样本边界</h1>\n<p><strong>Only One in Ten Is Decidable: The Sample Boundary of Gender Analysis</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>按角色描述中的性别词与亲属式判定，天才基本法可判定 14/140 人（10%），我在废土世界拆垃圾可判定 23/379 人（6.1%）。这个覆盖率不足以支撑任何性别对比，因此本文<strong>不给结论</strong>，只报告缺口的结构、产生原因，以及要做得成所必需的数据条件。</p>\n<p><strong>Abstract:</strong> Gender is decidable for only 10% and 6.1% of characters respectively, based on role descriptions. This coverage cannot support comparative claims; we therefore report the structure of the gap, its causes, and the data conditions required for a viable study.</p>\n<p><strong>关键词：</strong>性别研究；数据缺口；代词推断；样本偏差；方法论</p>\n<p><strong>Keywords:</strong> gender studies; data gap; pronoun inference; sampling bias; methodology</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>巴特勒（Butler, 2011）的核心主张是：性别不是先于表述的事实，而是在反复的表述中被建构的。这个主张对计算研究提出了一个尖锐的方法问题——如果性别是被表述出来的，那么我们抽取到的「性别」其实只是<strong>表述的痕迹</strong>，而不是人物的属性。本文因此把重点放在「能判定多少」而不是「男女各多少」上。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-判定规则\">2.1 判定规则</h3>\n<p>只使用角色描述（<code>characters[].role</code>）中的显式线索：性别词（女主角、母亲、妻子、她…）与亲属式（之母、之妻、之子…）。当男女线索同时出现时不判定。<strong>不使用代词猜测</strong>——章级描述里的「他/她」经常指代他人，这是本项目已经踩过的坑。</p>\n<h3 id=\"22-边界\">2.2 边界</h3>\n<p>角色描述本身是抽取产物，覆盖不全；且描述往往只写「身份」不写「性别」。因此下文所有百分比都只说明<strong>可判定率</strong>，不说明真实性别比例。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-可判定率10-与-61\">3.1 可判定率：10% 与 6.1%</h3>\n<p><strong>结论</strong>：天才可判定 14/140 人（10%），废土 23/379 人（6.1%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测（覆盖率本身）｜ 证据：<code>characters[].role</code> 词表判定 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>两个覆盖率都低于十分之一。这个数字本身就是结论：<strong>现有抽取无法支撑性别研究</strong>。任何基于此的「女性角色占比」「男女关系度差异」都会是抽样偏差，而不是发现。</p>\n<h3 id=\"32-缺口不是随机分布的\">3.2 缺口不是随机分布的</h3>\n<p><strong>结论</strong>：被判定的样本集中在核心与主要人物；龙套角色几乎全部不可判定。废土中可判定的男性样本平均出场章节数远低于女性样本。</p>\n<blockquote><p>可信度：中 ｜ 性质：推断（基于样本结构观察）｜ 证据：<code>characters[]</code> 的 tier 与 chapters 长度 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>如果缺口水位随机，样本还可以用；但它是<strong>系统性</strong>的：重要的角色被写得更详细，因此更容易被判定；不重要的角色连性别都没有被写。这意味着可判定样本在「重要性」维度上被截断，任何对比都会同时混入「重要性」的影响。哈拉威（Haraway, 1987）提醒我们，赛博格形象本身就是对二分范畴的扰乱；在这个语料里，连「范畴」都还没被稳定记录。</p>\n<h3 id=\"33-一条可用的替代路径\">3.3 一条可用的替代路径</h3>\n<p><strong>结论</strong>：称谓词的分布（见本刊语言学一篇）可以作为性别的<strong>间接</strong>指标：天才「姐」出现 3 次、「阿姨」3 次，废土「姐」19 次、「阿姨」2 次。</p>\n<blockquote><p>可信度：低 ｜ 性质：推断 ｜ 证据：<code>characters[].aliases</code> 子串计数 ｜ 来源：<code>characters.json</code></p></blockquote>\n<p>这条路径只能说明「哪些称谓被使用」，不能说明「谁是女性」。「姐」可以指亲属，也可以是一种尊称。本文列出它，是为了说明替代方案的上限，而不是推荐使用。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>一个诚实的计算研究应该报告它做不到什么。本文的结论是负面的：在现有数据上，性别研究<strong>不可做</strong>。要让它可做，需要三步：① 抽取阶段增加 <code>gender</code> 字段，并给出来源句；② 判定以原文代词与称谓为证据，逐条可追溯；③ 报告覆盖率，并在覆盖率低于阈值时拒绝出结论。</p>\n<p>赫尔德（Held, 2005）的关怀伦理提示了另一个方向：与其统计性别比例，不如统计<strong>照护劳动</strong>的分布——谁在照顾谁。这类数据在当前图谱里同样稀薄（救助关系中施救者与受助者的性别多不可判定），但它至少指向一个不依赖性别标签的问题。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>十分之一的可判定率不足以支撑结论。本文因此只报告缺口：它有多大、为什么产生、怎样才能补上。<strong>在数据不足时承认不足，比给出一个漂亮的百分比更接近研究伦理。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Butler, J. (2011). <em>Gender Trouble</em>. Routledge. https://doi.org/10.4324/9780203824979</li><li>Haraway, D. (1987). A manifesto for Cyborgs: Science, technology, and socialist feminism in the 1980s. <em>Australian Feminist Studies</em>, <em>2</em>(4), 1–42. https://doi.org/10.1080/08164649.1987.9961538</li><li>Held, V. (2005). <em>The Ethics of Care</em>. Oxford University PressNew York. https://doi.org/10.1093/0195180992.001.0001</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"14-medicine","zh":"疾病作为情节装置：两种身体叙事","en":"Illness as Plot Device: Two Narratives of the Body","kzh":"医学人文；疾病叙事；身体；照护；双文本对照","n_ref":3,"chars":3138,"html":"<h1 id=\"疾病作为情节装置两种身体叙事\">疾病作为情节装置：两种身体叙事</h1>\n<p><strong>Illness as Plot Device: Two Narratives of the Body</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>天才基本法把疾病写成记忆问题：事件名中「阿尔茨海默」14 次、「病」13 次，但医疗场所只有 2 处。我在废土世界扫垃圾把身体写成可改造、可污染的对象：「污染」141 次、「尸体」28 次，医疗场所 24 处。本文用比里的「传记性断裂」与哈拉威的赛博格说明：一种身体是被时间侵蚀的，一种身体是被技术改造的。</p>\n<p><strong>Abstract:</strong> Illness in Tiancai Jibenfa is a problem of memory (14 mentions of Alzheimer&#x27;s, only 2 medical sites), whereas the wasteland novel treats the body as modifiable and contaminable (141 pollution, 28 corpse mentions, 24 medical sites). We read the two through biographical disruption and cyborg theory.</p>\n<p><strong>关键词：</strong>医学人文；疾病叙事；身体；照护；双文本对照</p>\n<p><strong>Keywords:</strong> medical humanities; illness narrative; the body; care; comparative reading</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>医学人文的核心问题是：疾病如何改变一个人对自己的叙述。比里（Bury, 1982）把慢性病的影响概括为「传记性断裂」——原有的生活叙事被打断，人必须重写自己。两本小说都写了身体，但写法相反：一本写身体如何被时间侵蚀，一本写身体如何被技术改造。</p>\n<h2 id=\"2-数据与方法\">2. 数据与方法</h2>\n<h3 id=\"21-语料\">2.1 语料</h3>\n<p>天才 833 事件 / 256 地点；废土 2591 事件 / 1037 地点。医疗相关指标取自事件基类「科研医疗」「危机伤亡」与地点基类「医疗场所」。</p>\n<h3 id=\"22-关键词口径\">2.2 关键词口径</h3>\n<p>只统计<strong>事件名</strong>中的关键词出现次数，不读正文。词表：天才「阿尔茨海默」「病」；废土「污染」「尸体」。这是下限估计——正文里的病症描述未计入。</p>\n<h3 id=\"23-边界\">2.3 边界</h3>\n<p>「科研医疗」既包含治疗也包含实验，两类在伦理上完全不同，本文不做拆分。医疗场所的数量受地点抽取粒度影响（家中的病榻可能未被登记为医疗场所）。</p>\n<p><em>数据来源：本项目知识图谱现算；口径见 §2。</em></p>\n<h2 id=\"3-分析与发现\">3. 分析与发现</h2>\n<h3 id=\"31-疾病在事件里不在医院里\">3.1 疾病在事件里，不在医院里</h3>\n<p><strong>结论</strong>：天才科研医疗 50 件（6%），医疗场所仅 2 处（0.8%）；事件名含「阿尔茨海默」14 次、含「病」13 次。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测（关键词口径）｜ 证据：<code>events[].type_base</code>、<code>events[].name</code>、<code>locations[].type_base</code> ｜ 来源：<code>events.json</code> / <code>locations.json</code></p></blockquote>\n<p>疾病在这本书里几乎不发生在医院。它发生在家里、在记忆里、在一个人忽然认不出女儿的瞬间。医疗场所只有 2 处，而「阿尔茨海默」在事件名里出现 14 次——<strong>病是被叙述的，不是被治疗的</strong>。这与比里的观察一致：慢性病对当事人的意义，主要不在临床，而在日常秩序的瓦解。</p>\n<h3 id=\"32-身体作为可改造对象\">3.2 身体作为可改造对象</h3>\n<p><strong>结论</strong>：废土科研医疗 135 件（5.2%）、危机伤亡 128 件（4.9%）、医疗场所 24 处；事件名含「污染」141 次、含「尸体」28 次。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测（关键词口径）｜ 证据：同 3.1 ｜ 来源：<code>events.json</code> / <code>locations.json</code></p></blockquote>\n<p>废土的身体是<strong>边界模糊</strong>的：污染会进入身体，改造会替换器官，尸体是需要处理的对象。「尸体」28 次的出现频率说明死亡在这里是常态化的物质，而不是事件。哈拉威（Haraway, 1987）的赛博格宣言讨论的正是这种边界崩塌——人与机器、人与动物、人与污染之间不再有清晰分界。废土几乎是把这篇宣言写成了世界观。</p>\n<h3 id=\"33-照护的两种组织方式\">3.3 照护的两种组织方式</h3>\n<p><strong>结论</strong>：天才危机伤亡 2 件（0.2%），废土 128 件（4.9%）；天才救助关系去重 8 对，废土 52 对。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base</code>、<code>relations[].rel_base</code> 去重 ｜ 来源：<code>events.json</code> / <code>relations.json</code></p></blockquote>\n<p>照护在天才里是长期的、少数人对一个人的（8 对关系承担了全部救助记录）；在废土里是短期的、多点分布的（52 对关系）。赫尔德（Held, 2005）指出关怀伦理要求对具体他者的持续回应，这种持续性在天才是可能的，因为伤亡率极低；在废土，照护必须被制度化才能覆盖需求。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>两种身体叙事的政治含义不同。天才的身体是<strong>不可替换</strong>的：记忆一旦流失就无法恢复，因此照护的意义在于陪伴而非修复。废土的身体是<strong>可替换</strong>的：器官、义体、意识都能被改造，因此照护的意义转向维护与升级。前者接近医学人文的传统议题（尊严、叙事、临终），后者接近生物政治的新议题（可改造性、污染、去人性化）。</p>\n<p>边界在于：本文的关键词只覆盖事件名，正文中的病症描写、身体感受、医疗场景对话都没有进入统计。这些恰恰是医学人文最看重的质地，量化方法在这里只能提供骨架。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>天才基本法写的是被时间侵蚀的身体，我在废土世界扫垃圾写的是被技术改造的身体。前者把疾病写成记忆的丧失，后者把疾病写成边界的溃散。两种写法都指向同一个问题：<strong>当身体不再可靠，人靠什么确认自己还是自己。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Bury, M. (1982). Chronic illness as biographical disruption. <em>Sociology of Health &amp;amp; Illness</em>, <em>4</em>(2), 167–182. https://doi.org/10.1111/1467-9566.ep11339939</li><li>Haraway, D. (1987). A manifesto for Cyborgs: Science, technology, and socialist feminism in the 1980s. <em>Australian Feminist Studies</em>, <em>2</em>(4), 1–42. https://doi.org/10.1080/08164649.1987.9961538</li><li>Held, V. (2005). <em>The Ethics of Care</em>. Oxford University PressNew York. https://doi.org/10.1093/0195180992.001.0001</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"},{"slug":"15-method","zh":"从文本到图谱再到论文：一条可复核的计算批评流水线","en":"From Text to Graph to Paper: A Reproducible Pipeline for Computational Criticism","kzh":"计算批评；远读；知识图谱；可复现性；方法论文","n_ref":3,"chars":2935,"html":"<h1 id=\"从文本到图谱再到论文一条可复核的计算批评流水线\">从文本到图谱再到论文：一条可复核的计算批评流水线</h1>\n<p><strong>From Text to Graph to Paper: A Reproducible Pipeline for Computational Criticism</strong></p>\n<p><em>拆书项目组（Computational Reading of Two Novels）</em></p>\n<p><strong>摘要：</strong>本文报告一条从长篇小说到结构化知识图谱、再到跨学科论文的完整流水线：221+439 章、833+2591 件事件、482+1606 条关系记录。核心主张不是「数据能解释文学」，而是<strong>每一个数字都必须能被独立复算</strong>：图谱提供骨架，复算提供可信度，两者缺一不可。文中报告三处会改写结论的口径陷阱：跨章重复计数、类型归约残差、章号双口径。</p>\n<p><strong>Abstract:</strong> We report a reproducible pipeline from two long novels to a structured knowledge graph and a set of disciplinary papers (221+439 chapters, 833+2591 events, 482+1606 relation records). The claim is not that data explains literature, but that every number must be independently recomputable.</p>\n<p><strong>关键词：</strong>计算批评；远读；知识图谱；可复现性；方法论文</p>\n<p><strong>Keywords:</strong> computational criticism; distant reading; knowledge graph; reproducibility; methodology</p>\n<hr>\n<h2 id=\"1-引言\">1. 引言</h2>\n<p>杰克斯（Jockers, 2013）为「宏分析」辩护时强调，规模变化会带来问题变化：读一千本书不是把读一本放大一千倍，而是提出另一类问题。派珀（Piper, 2018）进一步指出，量化文学研究的关键不在算法，而在<strong>可枚举的单位</strong>——你数的是什么，决定你能说什么。本文承接这两个判断，报告一条具体流水线，并重点讨论它在哪里会骗人。</p>\n<h2 id=\"2-流水线\">2. 流水线</h2>\n<h3 id=\"21-四个阶段\">2.1 四个阶段</h3>\n<ol><li><strong>切分</strong>：按章切分原文，得到 221 与 439 个章节单元；</li><li><strong>抽取</strong>：从章节中抽取人物、地点、事件、关系、对白，形成五元组知识图谱——140/379 位人物、256/1037 处地点、833/2591 件事件、482/1606 条关系；</li><li><strong>归约</strong>：把开放词表压到固定的功能基类（事件 15 类、关系 17 类、地点 9–13 类），使跨书比较成为可能；</li><li><strong>复核</strong>：每个对外数字都由独立的校验脚本重算一遍，不一致即失败。</li></ol>\n<h3 id=\"22-复核的三道闸\">2.2 复核的三道闸</h3>\n<ul><li><strong>结构闸</strong>：章节数、事件数、关系数是否与源文件一致；</li><li><strong>口径闸</strong>：同一指标在「素材生成」与「文档校验」两处分别实现，结果必须相等；</li><li><strong>回归闸</strong>：脚本重构前后，输出必须逐字节一致。</li></ul>\n<h2 id=\"3-三个会改写结论的口径陷阱\">3. 三个会改写结论的口径陷阱</h2>\n<h3 id=\"31-跨章重复计数\">3.1 跨章重复计数</h3>\n<p><strong>结论</strong>：天才 482 条关系只对应 80 个唯一对（6.03 条/对），废土 1606 条对应 492 对（3.26 条/对）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>relations[].from/to</code> 无向去重 ｜ 来源：<code>relations.json</code></p></blockquote>\n<p>同一对人物在不同章节被各记一次，会导致「关系条数」被读成「社交广度」。按条数排名，一个反复出现的配角可以超过主角。<strong>修正方式</strong>：所有拓扑量（度、连通分量、救助对数）一律先去重，原始条数并列披露。</p>\n<h3 id=\"32-类型归约残差\">3.2 类型归约残差</h3>\n<p><strong>结论</strong>：无法归入任何功能基类的事件，天才 40 件（4.8%），废土 378 件（14.6%）。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>events[].type_base == &quot;其他&quot;</code> ｜ 来源：<code>events.json</code></p></blockquote>\n<p>残差不是垃圾，是<strong>词表的边界</strong>。废土残差占比更高，说明它的语域（污染、改造、组织）离家校题材更远，归约词表的覆盖更吃力。任何跨书比较都应把残差写出来，否则读者会以为分类是完备的。</p>\n<h3 id=\"33-章号双口径\">3.3 章号双口径</h3>\n<p><strong>结论</strong>：天才的章节存在两套编号（抽取位 <code>index</code> 与正文章号 <code>no</code>），第 112 章之后 <code>index = no + 3</code>；废土两者一致。</p>\n<blockquote><p>可信度：高 ｜ 性质：实测 ｜ 证据：<code>chapters[].index / .no</code> ｜ 来源：<code>chapters.json</code></p></blockquote>\n<p>这个陷阱已经造成过一次真实错误：金句页把章号写进了内部索引字段，点击「第 221 章」打开的是第 218 章。<strong>修正方式</strong>：章号换算收敛到唯一入口，对外一律用正文章号，内部索引只在点击时使用。</p>\n<h2 id=\"4-讨论\">4. 讨论</h2>\n<p>莫莱蒂（Moretti, 2011）用网络图研究情节时说过一句常被引用的话：距离不是障碍，而是<strong>一种看待方式</strong>。本文的补充是：距离也会掩盖错误。离得越远，越容易把计数口径当作事实。因此远读的方法论必须包含「复核」这一环——不是为了证明数据正确，而是为了知道它在哪儿错。</p>\n<p>这条流水线的上限也需要说明：它能回答「什么被写了多少次」，不能回答「写得怎么样」。文学判断仍然需要细读，图谱只是把细读的对象从全文压缩到可疑之处。</p>\n<h2 id=\"5-结论\">5. 结论</h2>\n<p>一条可复核的流水线由三件事构成：明确的单位、写出来的口径、独立实现的校验。缺了第三件，前两件都会退化为修辞。<strong>计算批评的可信度不来自算法的复杂，而来自每一个数字都能被重新算一遍。</strong></p>\n<h2 id=\"参考文献\">参考文献</h2>\n<ul><li>Jockers, M. L. (2013). <em>Macroanalysis</em>. University of Illinois Press. https://doi.org/10.5406/illinois/9780252037528.001.0001</li><li>Moretti, F. (2011). Network Theory, Plot Analysis. <em>New Left Review</em>, <em>2</em>(68), 80–102. https://doi.org/10.64590/vko</li><li>Piper, A. (2018). <em>Enumerations</em>. University of Chicago Press. https://doi.org/10.7208/chicago/9780226568898.001.0001</li></ul>\n<blockquote><p>文献核验：以上 3 条均由 <code>src/verify_refs.py</code> 逐条检索 Crossref，命中类型、年份、作者与标题相似度四道闸后才写入；DOI 可直接打开原记录。少数专著在 Crossref 的注册题名省略了副标题，以注册记录为准。</p></blockquote>"}],"n":15,"src":"papers/"},"insightIndex":{"titles":{"天才基本法-多学科视角分析KG-实证--明察式":"《天才基本法》· 多学科视角分析（KG 实证 · 明察式）","可信度图例":"可信度图例","1-社会学师徒制而非科层":"1 社会学：师徒制，而非科层","11-权力结构以知识传承师徒为核心":"1.1 权力结构以知识传承（师徒）为核心","12-这是一部师徒制小说解读":"1.2 这是一部「师徒制」小说（解读）","13-人物网络高度长尾":"1.3 人物网络高度长尾","14-关系残差单列不假装归类":"1.4 关系残差单列（不假装归类）","2-心理学情感记忆是双线穿越的锚":"2 心理学：情感记忆是双线穿越的锚","21-记忆情感事件稀疏但集中于主角":"2.1 记忆情感事件稀疏但集中于主角","22-情感锚在现实线密度高峰是穿越归来的重逢段解读":"2.2 情感锚在现实线，密度高峰是穿越归来的重逢段（解读）","3-经济学智力成长驱动经济系统近乎空白":"3 经济学：智力成长驱动，经济系统近乎空白","31-没有任务收益循环":"3.1 没有任务—收益循环","32-交换的是知识而非物资解读":"3.2 交换的是知识而非物资（解读）","4-政治学制度秩序弱冲突来自个体与家庭":"4 政治学：制度秩序弱，冲突来自个体与家庭","41-制度秩序与科层几乎不共现":"4.1 制度秩序与科层几乎不共现","42-一部去制度化的成长叙事解读":"4.2 一部「去制度化」的成长叙事（解读）","5-叙事学双线分化在体量与类型不在密度":"5 叙事学：双线分化在体量与类型，不在密度","51-芝士世界是主舞台靠体量与类型构成不靠节奏快慢":"5.1 芝士世界是主舞台——靠体量与类型构成，不靠节奏快慢","52-张力来自穿越重读高中解读":"5.2 张力来自「穿越重读高中」（解读）","6-教育学成长学习即主题本身":"6 教育学：成长学习即主题本身","61-一个关于如何学为何学的教育小说":"6.1 一个关于「如何学、为何学」的教育小说","62-与废土互补一个学一个活解读":"6.2 与废土互补：一个学、一个活（解读）","7-地理学一个高度复用的学校福利院办公室三角":"7 地理学：一个高度复用的「学校—福利院—办公室」三角","71-场景类型近一半是据点--教育科研":"7.1 场景类型近一半是「据点 + 教育科研」","72-场景复用极高一个办公室装了-74-的事件":"7.2 场景复用极高：一个办公室装了 7.4% 的事件","73-反复出现的空间是记忆锚点解读":"7.3 反复出现的空间是「记忆锚点」（解读）","8-网络科学单星拓扑":"8 网络科学：单星拓扑","81-先说数据事实482-条边只对应-80-个唯一对":"8.1 先说数据事实：482 条边只对应 80 个唯一对","82-586-的人物没有任何关系边":"8.2 58.6% 的人物没有任何关系边","83-林朝夕是唯一的中心":"8.3 林朝夕是唯一的中心","9-语言学校园语域与低标注对白":"9 语言学：校园语域与低标注对白","91-称谓随关系位置漂移":"9.1 称谓随关系位置漂移","92-称谓词表同学-12叔-9老师-8哥-6":"9.2 称谓词表：同学 12、叔 9、老师 8、哥 6","93-只有-400-的入选对白能归属到说话人":"9.3 只有 40.0% 的入选对白能归属到说话人","10-传播学信息靠教不靠探":"10 传播学：信息靠「教」，不靠「探」","101-信息类事件只占-44":"10.1 信息类事件只占 4.4%","102-信息事件是小圈对话":"10.2 信息事件是小圈对话","11-法学秩序冲突都在规则之内":"11 法学·秩序：冲突都在规则之内","111-零战斗93-件冲突有裁判的竞争":"11.1 零战斗、93
